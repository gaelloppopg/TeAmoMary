<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1000 Razones 🌸</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#f28ca6" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />

  <script>
    (function() {
      const ok = localStorage.getItem("auth_novia_ok");
      const t = parseInt(localStorage.getItem("auth_novia_time") || "0", 10);
      const valido = ok === "true" && (Date.now() - t) < 60 * 60 * 1000;
      if (!valido) location.replace("../login.html");
    })();
  </script>
</head>
<body class="page-inner"
      data-cancion-titulo="Nuestra Canción"
      data-cancion-artista="Para ti 💕">

  <nav class="nav-back"><a href="../index.html">← Volver</a></nav>

  <header class="page-header">
    <h1>Razones por las que me enamoré de ti</h1>
    <p>Y las que faltan por escribir...</p>
  </header>

  <div class="razones-controles">
    <input type="text" id="buscadorRazones" placeholder="🔍 Buscar una razón..." />
    <div class="razones-contador">
      <span id="contadorRazones">0</span> razones 💗
    </div>
  </div>

  <section class="razones-grid" id="razonesGrid"></section>

  <footer class="footer"><p>Ahora... <a href="juego.html">vamos a jugar →</a></p></footer>

  <canvas id="confetiCanvas" class="confeti-canvas"></canvas>
  <script src="../js/script.js"></script>
  <script src="../js/razones.js"></script>
  <script src="../js/musica-global.js"></script>
  <script src="../js/confeti.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
