<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Juego 💜</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#e9d5ff" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>" />

  <script>
    (function() {
      const ok = localStorage.getItem("auth_novia_ok");
      const t = parseInt(localStorage.getItem("auth_novia_time") || "0", 10);
      const valido = ok === "true" && (Date.now() - t) < 60 * 60 * 1000;
      if (!valido) location.replace("../login.html");
    })();
  </script>

  <style>
    /* ============================================
       JUEGO — EXPERIENCIA PREMIUM
       ============================================ */

    html, body.juego-page {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    body.juego-page {
      background: #faf3ff;
      color: #3a2145;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Fondos animados */
    .aurora-canvas {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
    }
    .particulas-canvas {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }

    body.juego-page::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 12% 22%, rgba(201, 156, 240, 0.35) 1px, transparent 1.5px),
        radial-gradient(circle at 78% 18%, rgba(240, 170, 200, 0.4) 1px, transparent 1.5px),
        radial-gradient(circle at 44% 76%, rgba(201, 156, 240, 0.3) 1px, transparent 1.5px),
        radial-gradient(circle at 92% 60%, rgba(240, 170, 200, 0.35) 1px, transparent 1.5px);
      z-index: -1;
      pointer-events: none;
      animation: titilarEstrellas 6s ease-in-out infinite alternate;
    }
    @keyframes titilarEstrellas {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* ===== NAV ===== */
    body.juego-page .nav-back {
      position: sticky;
      top: 0;
      padding: 16px 30px;
      background: rgba(255, 250, 255, 0.65);
      border-bottom: 1px solid rgba(180, 130, 240, 0.12);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      z-index: 100;
    }
    body.juego-page .nav-back a {
      color: #6a4780;
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.3s ease;
      text-decoration: none;
    }
    body.juego-page .nav-back a:hover {
      color: #a874e8;
    }

    /* ============================================
       HERO
       ============================================ */
    .juego-hero {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px 30px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .juego-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #a874e8;
      font-weight: 600;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeInJuego 1.2s ease 0.2s forwards;
    }
    .juego-hero-badge::before,
    .juego-hero-badge::after {
      content: "";
      width: 32px;
      height: 1px;
      background: linear-gradient(to right, transparent, #c99cf0, transparent);
    }

    .juego-hero h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.9rem, 5vw, 3.2rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #3a2145;
      margin-bottom: 18px;
      opacity: 0;
      animation: fadeInJuego 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }
    .juego-hero h1 em {
      color: #a874e8;
      text-shadow: 0 0 40px rgba(201, 156, 240, 0.5);
    }
    .juego-hero p {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 1.5vw, 1.18rem);
      font-style: italic;
      font-weight: 300;
      color: #7a5c8c;
      line-height: 1.65;
      max-width: 540px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeInJuego 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }
    @keyframes fadeInJuego {
      from { opacity: 0; transform: translateY(20px); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* ============================================
       HUD PREMIUM
       ============================================ */
    .juego-hud {
      max-width: 780px;
      margin: 40px auto 0;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      opacity: 0;
      animation: fadeInJuego 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }

    .hud-card {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(180, 130, 240, 0.22);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      box-shadow:
        0 10px 28px rgba(160, 100, 220, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }
    .hud-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      border-radius: 18px 0 0 18px;
    }
    .hud-card.puntos::before { background: linear-gradient(to bottom, #c99cf0, #a874e8); }
    .hud-card.racha::before { background: linear-gradient(to bottom, #ff9a5a, #ff5a3a); }
    .hud-card.tiempo::before { background: linear-gradient(to bottom, #7cd6b4, #4ca88a); }

    .hud-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8a7aa8;
      font-weight: 600;
    }
    .hud-value {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 500;
      color: #3a2145;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .hud-card.puntos .hud-value { color: #a874e8; }
    .hud-card.racha .hud-value { color: #ff6a4a; }
    .hud-card.tiempo .hud-value { color: #3a9a7a; }

    .hud-value.bump {
      animation: bump 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes bump {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); color: #ff9a5a; }
      100% { transform: scale(1); }
    }

    /* Barra de tiempo */
    .tiempo-barra {
      grid-column: 1 / -1;
      height: 6px;
      background: rgba(180, 130, 240, 0.12);
      border-radius: 50px;
      overflow: hidden;
      margin-top: 8px;
      position: relative;
    }
    .tiempo-barra-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #7cd6b4 0%, #d4c95a 60%, #ff5a3a 100%);
      border-radius: 50px;
      transition: width 1s linear;
      box-shadow: 0 0 12px rgba(124, 214, 180, 0.6);
    }
    .tiempo-barra-fill.alerta {
      animation: alertaTiempo 0.6s ease-in-out infinite;
    }
    @keyframes alertaTiempo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ============================================
       TARJETA DE PREGUNTA
       ============================================ */
    .juego-card {
      max-width: 780px;
      margin: 30px auto 0;
      padding: 0 24px;
      position: relative;
      z-index: 2;
      opacity: 0;
      animation: fadeInJuego 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
    }

    .pregunta-wrap {
      background:
        linear-gradient(155deg,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(252, 244, 255, 0.95) 55%,
          rgba(255, 248, 252, 0.98) 100%);
      border: 1px solid rgba(200, 160, 240, 0.3);
      border-radius: 28px;
      padding: 45px 40px 40px;
      box-shadow:
        0 24px 60px rgba(160, 100, 220, 0.15),
        0 8px 20px rgba(200, 160, 240, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      position: relative;
      overflow: hidden;
    }

    .pregunta-wrap::before {
      content: "";
      position: absolute;
      top: -30%;
      left: -20%;
      width: 120%;
      height: 120%;
      background: radial-gradient(
        ellipse at 30% 20%,
        rgba(220, 180, 255, 0.3) 0%,
        transparent 55%
      );
      pointer-events: none;
      opacity: 0.7;
    }

    /* Indicador de pregunta */
    .pregunta-indicador {
      position: absolute;
      top: 20px;
      right: 24px;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #a874e8;
      font-weight: 600;
      padding: 6px 14px;
      border: 1px solid rgba(201, 156, 240, 0.35);
      border-radius: 50px;
      background: rgba(201, 156, 240, 0.08);
    }

    .pregunta-dificultad {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 22px;
      position: relative;
      z-index: 2;
    }
    .pregunta-dificultad::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .pregunta-dificultad.facil {
      color: #3a9a7a;
      background: rgba(124, 214, 180, 0.15);
    }
    .pregunta-dificultad.media {
      color: #d4a373;
      background: rgba(212, 163, 115, 0.15);
    }
    .pregunta-dificultad.dificil {
      color: #e85a8a;
      background: rgba(232, 90, 138, 0.15);
    }

    .pregunta-texto {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 3vw, 1.85rem);
      font-weight: 400;
      line-height: 1.3;
      color: #3a2145;
      letter-spacing: -0.01em;
      margin-bottom: 36px;
      position: relative;
      z-index: 2;
      min-height: 2em;
    }

    /* Opciones */
    .opciones-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      position: relative;
      z-index: 2;
    }

    .opcion-btn {
      position: relative;
      padding: 20px 22px;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(180, 130, 240, 0.25);
      border-radius: 18px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: #4a2a5a;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
      line-height: 1.35;
    }

    /* Letra de la opción */
    .opcion-letra {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e9d5ff, #c99cf0);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(160, 100, 220, 0.25);
    }

    .opcion-btn:hover:not(:disabled) {
      border-color: rgba(201, 156, 240, 0.7);
      background: rgba(252, 244, 255, 1);
      transform: translateY(-2px);
      box-shadow:
        0 12px 30px rgba(160, 100, 220, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }
    .opcion-btn:hover:not(:disabled) .opcion-letra {
      transform: scale(1.1) rotate(-5deg);
      background: linear-gradient(135deg, #c99cf0, #a874e8);
    }
    .opcion-btn:disabled {
      cursor: default;
    }

    /* Correcto */
    .opcion-btn.correcta {
      background: linear-gradient(135deg, rgba(124, 214, 180, 0.25), rgba(76, 168, 138, 0.15));
      border-color: #4ca88a;
      color: #2a6a52;
      font-weight: 600;
      animation: pulsoCorrecta 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .opcion-btn.correcta .opcion-letra {
      background: linear-gradient(135deg, #7cd6b4, #4ca88a);
      transform: scale(1.15);
    }
    @keyframes pulsoCorrecta {
      0% { transform: scale(1); }
      40% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    /* Incorrecta */
    .opcion-btn.incorrecta {
      background: linear-gradient(135deg, rgba(255, 200, 220, 0.5), rgba(232, 90, 138, 0.15));
      border-color: #e85a8a;
      color: #8a2050;
      animation: sacudidaIncorrecta 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }
    .opcion-btn.incorrecta .opcion-letra {
      background: linear-gradient(135deg, #ff9ab8, #e85a8a);
    }
    @keyframes sacudidaIncorrecta {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    /* Feedback flotante */
    .feedback-flotante {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-style: italic;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }
    .feedback-flotante.ok {
      color: #4ca88a;
    }
    .feedback-flotante.fail {
      color: #e85a8a;
    }
    .feedback-flotante.show {
      animation: feedbackPop 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes feedbackPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      60% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -70%) scale(0.9); }
    }

    /* Mensaje de bonus */
    .feedback-bonus {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      color: #ff8a3a;
      padding: 10px 22px;
      background: rgba(255, 200, 130, 0.9);
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(255, 130, 50, 0.4);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      white-space: nowrap;
    }
    .feedback-bonus.show {
      animation: bonusPop 1.6s ease-out forwards;
    }
    @keyframes bonusPop {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.8); }
      20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.05); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(0.95); }
    }

    /* ============================================
       PANTALLA DE INICIO
       ============================================ */
    .juego-inicio {
      max-width: 780px;
      margin: 30px auto 60px;
      padding: 0 24px;
      text-align: center;
    }
    .inicio-card {
      background:
        linear-gradient(155deg,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(252, 244, 255, 0.95) 55%,
          rgba(255, 248, 252, 0.98) 100%);
      border: 1px solid rgba(200, 160, 240, 0.3);
      border-radius: 28px;
      padding: 50px 40px;
      box-shadow:
        0 24px 60px rgba(160, 100, 220, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      position: relative;
      overflow: hidden;
    }
    .inicio-card::before {
      content: "❦";
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: #c99cf0;
      font-size: 1.4rem;
      opacity: 0.7;
    }
    .inicio-card h2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 400;
      color: #3a2145;
      margin-bottom: 14px;
      margin-top: 24px;
    }
    .inicio-card p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-style: italic;
      color: #7a5c8c;
      line-height: 1.6;
      max-width: 460px;
      margin: 0 auto 30px;
    }
    .inicio-card .btn {
      padding: 16px 40px;
      font-size: 0.85rem;
      letter-spacing: 3px;
    }

    /* ============================================
       PANTALLA FINAL
       ============================================ */
    .juego-final {
      text-align: center;
      padding: 20px 0;
    }
    .juego-final .medalla {
      font-size: 4rem;
      display: block;
      margin-bottom: 18px;
      animation: flotarMedalla 3s ease-in-out infinite;
      filter: drop-shadow(0 10px 30px rgba(201, 156, 240, 0.6));
    }
    @keyframes flotarMedalla {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    .juego-final h2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 400;
      color: #3a2145;
      margin-bottom: 14px;
    }
    .juego-final .final-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-style: italic;
      color: #7a5c8c;
      margin-bottom: 30px;
    }
    .final-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 480px;
      margin: 0 auto 30px;
    }
    .final-stat {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(180, 130, 240, 0.2);
      border-radius: 16px;
      padding: 16px 12px;
    }
    .final-stat-label {
      font-size: 0.55rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8a7aa8;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }
    .final-stat-valor {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 500;
      color: #a874e8;
      line-height: 1;
    }
    .final-mensaje {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: #a874e8;
      margin-bottom: 30px;
      padding: 20px;
      border-top: 1px solid rgba(201, 156, 240, 0.3);
      border-bottom: 1px solid rgba(201, 156, 240, 0.3);
      line-height: 1.5;
    }
        /* Botón hacia la cuponera */
    .btn-ir-cuponera {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #c99cf0, #a874e8);
      color: #fff;
      border-radius: 50px;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow:
        0 10px 26px rgba(160, 100, 220, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }
    .btn-ir-cuponera::after {
      content: "→";
      transition: transform 0.3s ease;
    }
    .btn-ir-cuponera:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 16px 36px rgba(160, 100, 220, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .btn-ir-cuponera:hover::after {
      transform: translateX(4px);
    }

    /* ============================================
       ANIMACIÓN DE TRANSICIÓN ENTRE PREGUNTAS
       ============================================ */
    .pregunta-wrap.saliendo {
      animation: salirPregunta 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }
    .pregunta-wrap.entrando {
      animation: entrarPregunta 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes salirPregunta {
      to { opacity: 0; transform: translateY(-30px) scale(0.96); filter: blur(8px); }
    }
    @keyframes entrarPregunta {

<body class="page-inner juego-page"

        <!-- Botón de acceso a la cuponera -->

  <!-- ===== JUEGO ===== -->
  <div class="juego-card" id="juegoCard">
    <div class="pregunta-wrap" id="preguntaWrap"></div>
  </div>

  <!-- Feedback flotante -->
  <div class="feedback-flotante" id="feedbackFlotante"></div>
  <div class="feedback-bonus" id="feedbackBonus"></div>

  <canvas id="confetiCanvas" class="confeti-canvas"></canvas>
  <script src="../js/script.js"></script>
  <script src="../js/musica-global.js"></script>
  <script src="../js/pwa.js"></script>

  <script>
    /* ============================================
       JUEGO PREMIUM — TRIVIA CON TIEMPO
       ============================================ */

    (function () {
      "use strict";

      // ============ PREGUNTAS ============
      // dificultad: "facil" | "media" | "dificil"
      const PREGUNTAS = [
        {
          pregunta: "¿Cuál es nuestra canción?",
          opciones: ["Dame amor", "Madonna", "Mi bello angel", "Abrazado a ti"],
          correcta: 0,
          puntos: 5,
          dificultad: "facil"
        },
        {
          pregunta: "¿Qué color me recuerda a ti?",
          opciones: ["Azul", "Morado", "Verde", "Amarillo"],
          correcta: 1,
          puntos: 5,
          dificultad: "facil"
        },
        {
          pregunta: "¿Primer mensaje?",
          opciones: ["Gpi", "Hola", "gpi", "Otra"],
          correcta: 0,
          puntos: 7,
          dificultad: "media"
        },
        {
          pregunta: "¿Dónde fue nuestra primera cita?",
          opciones: ["Cine", "Canchas", "Bicentenario", "Sushito"],
          correcta: 0,
          puntos: 7,
          dificultad: "media"
        },
        {
          pregunta: "¿Qué dia te di las primeras flores?",
          opciones: ["28/05/26", "29/05/26", "27/05/26", "26/05/26"],
          correcta: 0,
          puntos: 9,
          dificultad: "dificil"
        }
      ];

      const LIMITE_DIARIO = 100;
      const TIEMPO_PREGUNTA = 15; // segundos
      const STORAGE_PUNTOS = "puntos_amor";
      const STORAGE_LIMITE = "juego_limite_diario";

      // ============ ESTADO ============
      let estado = {
        indice: 0,
        puntosSesion: 0,
        racha: 0,
        correctas: 0,
        respondidas: 0,
        respondiendo: false,
        tiempoRestante: TIEMPO_PREGUNTA,
        tiempoInterval: null
      };

      // ============ AUDIO SIMPLE (Web Audio API) ============
      let audioCtx = null;
      function sonido(tipo) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (tipo === "acierto") {
            osc.frequency.setValueAtTime(660, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
            osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.35);
          } else if (tipo === "fallo") {
            osc.frequency.setValueAtTime(280, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.35);
          } else if (tipo === "tick") {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.08);
          } else if (tipo === "bonus") {
            [660, 880, 1320].forEach((f, i) => {
              const o = audioCtx.createOscillator();
              const g = audioCtx.createGain();
              o.connect(g); g.connect(audioCtx.destination);
              o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.06);
              g.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.06);
              g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.06 + 0.2);
              o.start(audioCtx.currentTime + i * 0.06);
              o.stop(audioCtx.currentTime + i * 0.06 + 0.2);
            });
          }
        } catch (e) {}
      }

      // ============ FONDOS ANIMADOS ============
      (function auroraFondo() {
        const canvas = document.getElementById("auroraCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let w, h;
        function resize() {
          w = canvas.width = window.innerWidth * devicePixelRatio;
          h = canvas.height = window.innerHeight * devicePixelRatio;
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
        }
        resize();
        window.addEventListener("resize", resize);

        const blobs = [
          { x: 0.2, y: 0.3, r: 0.5, color: [233, 213, 255], speed: 0.00010, fase: 0 },
          { x: 0.8, y: 0.7, r: 0.5, color: [255, 214, 232], speed: 0.00013, fase: Math.PI },
          { x: 0.5, y: 0.6, r: 0.4, color: [220, 180, 255], speed: 0.00008, fase: Math.PI * 1.4 }
        ];
        const start = performance.now();
        function render(now) {
          const t = now - start;
          ctx.clearRect(0, 0, w, h);
          blobs.forEach(b => {
            const cx = (b.x + Math.sin(t * b.speed + b.fase) * 0.12) * w;
            const cy = (b.y + Math.cos(t * b.speed * 1.3 + b.fase) * 0.12) * h;
            const r = b.r * Math.min(w, h);
            const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            g.addColorStop(0, `rgba(${b.color[0]}, ${b.color[1]}, ${b.color[2]}, 0.5)`);
            g.addColorStop(1, `rgba(${b.color[0]}, ${b.color[1]}, ${b.color[2]}, 0)`);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
          });
          requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
      })();

      (function polvoDorado() {
        const canvas = document.getElementById("particulasCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let w, h;
        function resize() {
          w = canvas.width = window.innerWidth * devicePixelRatio;
          h = canvas.height = window.innerHeight * devicePixelRatio;
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
        }
        resize();
        window.addEventListener("resize", resize);
        const N = Math.min(50, Math.floor(window.innerWidth / 28));
        const parts = [];
        for (let i = 0; i < N; i++) {
          parts.push({
            x: Math.random() * w, y: Math.random() * h,
            r: (Math.random() * 1.5 + 0.4) * devicePixelRatio,
            vx: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
            vy: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
            a: Math.random() * 0.5 + 0.2, fase: Math.random() * Math.PI * 2,
            tipo: Math.random() < 0.6 ? "lav" : "dor"
          });
        }
        function render() {
          ctx.clearRect(0, 0, w, h);
          parts.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.fase += 0.01;
            if (p.x < -20) p.x = w + 20;
            if (p.x > w + 20) p.x = -20;
            if (p.y < -20) p.y = h + 20;
            if (p.y > h + 20) p.y = -20;
            const alpha = p.a * (0.7 + 0.3 * Math.sin(p.fase));
            const color = p.tipo === "lav" ? `rgba(201, 156, 240, ${alpha})` : `rgba(212, 163, 115, ${alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.shadowBlur = 10 * devicePixelRatio;
            ctx.shadowColor = color;
            ctx.fill();
          });
          requestAnimationFrame(render);
        }
        render();
      })();

      // ============ LÍMITE DIARIO ============
      function hoyISO() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      }
      function getLimite() {
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_LIMITE) || "{}");
          if (data.fecha === hoyISO()) return data;
        } catch (e) {}
        const nuevo = { fecha: hoyISO(), ganados: 0 };
        localStorage.setItem(STORAGE_LIMITE, JSON.stringify(nuevo));
        return nuevo;
      }
      function setLimite(data) {
        localStorage.setItem(STORAGE_LIMITE, JSON.stringify(data));
      }
      function puntosRestantesHoy() {
        return Math.max(0, LIMITE_DIARIO - getLimite().ganados);
      }

      // ============ PUNTOS ============
      function getPuntos() {
        return parseInt(localStorage.getItem(STORAGE_PUNTOS) || "0", 10);
      }
      function sumarPuntos(cantidad) {
        const nuevos = getPuntos() + cantidad;
        localStorage.setItem(STORAGE_PUNTOS, nuevos);
        const el = document.getElementById("puntosJuego");
        el.textContent = nuevos;
        el.classList.add("bump");
        setTimeout(() => el.classList.remove("bump"), 400);
        return nuevos;
      }

      // ============ HUD ============
      function actualizarHUD() {
        document.getElementById("puntosJuego").textContent = getPuntos();
        document.getElementById("racha").textContent = estado.racha;
        document.getElementById("tiempoRestante").textContent = estado.tiempoRestante;
        
      }

      

      // ============ ANIMACIÓN DE TIEMPO ============
      function iniciarTiempo() {
        detenerTiempo();
        estado.tiempoRestante = TIEMPO_PREGUNTA;
        actualizarHUD();
        actualizarBarraTiempo();

        estado.tiempoInterval = setInterval(() => {
          estado.tiempoRestante--;
          actualizarHUD();
          actualizarBarraTiempo();

          // Tick sonoro cuando quedan 5 segundos o menos
          if (estado.tiempoRestante <= 5 && estado.tiempoRestante > 0) {
            sonido("tick");
            document.getElementById("tiempoBarraFill").classList.add("alerta");
          } else {
            document.getElementById("tiempoBarraFill").classList.remove("alerta");
          }

          if (estado.tiempoRestante <= 0) {
            detenerTiempo();
            if (!estado.respondiendo) {
              tiempoAgotado();
            }
          }
        }, 1000);
      }

      function detenerTiempo() {
        if (estado.tiempoInterval) {
          clearInterval(estado.tiempoInterval);
          estado.tiempoInterval = null;
        }
        document.getElementById("tiempoBarraFill").classList.remove("alerta");
      }

      function actualizarBarraTiempo() {
        const pct = (estado.tiempoRestante / TIEMPO_PREGUNTA) * 100;
        document.getElementById("tiempoBarraFill").style.width = pct + "%";
      }

      function tiempoAgotado() {
        estado.respondiendo = true;
        estado.racha = 0;
        document.getElementById("racha").textContent = 0;

        

        // Marcar todas como deshabilitadas
        document.querySelectorAll(".opcion-btn").forEach(b => b.disabled = true);
        // Marcar la correcta en verde
        const p = PREGUNTAS[estado.indice];
        document.querySelectorAll(".opcion-btn")[p.correcta].classList.add("correcta");

        mostrarFeedback("¡Se acabó!", "fail");
        sonido("fallo");
        estado.respondidas++;

        setTimeout(() => siguientePregunta(), 1600);
      }

      // ============ MOSTRAR FEEDBACK ============
      function mostrarFeedback(texto, tipo) {
        const el = document.getElementById("feedbackFlotante");
        el.textContent = texto;
        el.className = `feedback-flotante ${tipo}`;
        void el.offsetWidth;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 1200);
      }

      function mostrarBonus(texto) {
        const el = document.getElementById("feedbackBonus");
        el.textContent = texto;
        el.classList.remove("show");
        void el.offsetWidth;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 1600);
      }

      // ============ RENDER PREGUNTA ============
      function renderPregunta() {
        const wrap = document.getElementById("preguntaWrap");
        const p = PREGUNTAS[estado.indice];

        // Reiniciar
        wrap.classList.remove("saliendo");
        wrap.classList.add("entrando");
        setTimeout(() => wrap.classList.remove("entrando"), 700);

        const letras = ["A", "B", "C", "D"];
        const dificultadLabel = {
          facil: "Fácil",
          media: "Media",
          dificil: "Difícil"
        }[p.dificultad];

        wrap.innerHTML = `
          <div class="pregunta-indicador">
            ${estado.indice + 1} / ${PREGUNTAS.length}
          </div>
          <span class="pregunta-dificultad ${p.dificultad}">${dificultadLabel} · ${p.puntos} pts</span>
          <h2 class="pregunta-texto">${p.pregunta}</h2>
          <div class="opciones-grid">
            ${p.opciones.map((op, i) => `
              <button class="opcion-btn" data-index="${i}">
                <span class="opcion-letra">${letras[i]}</span>
                <span class="opcion-texto">${op}</span>
              </button>
            `).join("")}
          </div>
        `;

        estado.respondiendo = false;
        document.querySelectorAll(".opcion-btn").forEach(btn => {
          btn.addEventListener("click", () => responder(parseInt(btn.dataset.index, 10)));
        });

        iniciarTiempo();
      }

      // ============ RESPONDER ============
      function responder(indiceElegido) {
        if (estado.respondiendo) return;
        estado.respondiendo = true;
        detenerTiempo();

        const p = PREGUNTAS[estado.indice];
        const botones = document.querySelectorAll(".opcion-btn");
        botones.forEach(b => b.disabled = true);

        const correcto = indiceElegido === p.correcta;

        // Marcar
        botones[p.correcta].classList.add("correcta");
        if (!correcto) botones[indiceElegido].classList.add("incorrecta");

        if (correcto) {
          estado.racha++;
          estado.correctas++;

          // Puntos base
          let puntos = p.puntos;

          // Bonus por velocidad
          const bonusVelocidad = estado.tiempoRestante >= 10 ? 5 : 0;
          if (bonusVelocidad) {
            puntos += bonusVelocidad;
          }

          // Bonus por racha
          const bonusRacha = estado.racha >= 3 ? 5 : 0;
          if (bonusRacha) {
            puntos += bonusRacha;
          }

          // Límite diario
          const restantes = puntosRestantesHoy();
          let puntosFinales = puntos;
          let avisoLimite = "";

          if (restantes <= 0) {
            puntosFinales = 0;
            avisoLimite = " · límite diario alcanzado";
          } else if (puntos > restantes) {
            puntosFinales = restantes;
            avisoLimite = ` · solo ${restantes} disponibles`;
          }

          if (puntosFinales > 0) {
            sumarPuntos(puntosFinales);
            const data = getLimite();
            data.ganados += puntosFinales;
            setLimite(data);
          }

          mostrarFeedback("¡Correcto!", "ok");
          sonido("acierto");
          document.getElementById("racha").textContent = estado.racha;

          // Feedback bonus
          let mensajeBonus = [];
          if (bonusVelocidad) mensajeBonus.push("rápida");
          if (bonusRacha) mensajeBonus.push("racha");
          if (mensajeBonus.length) {
            setTimeout(() => {
              mostrarBonus(`+ bonus por ${mensajeBonus.join(" y ")}`);
              sonido("bonus");
            }, 400);
          }

          if (window.lanzarConfeti) window.lanzarConfeti(1500);
        } else {
          estado.racha = 0;
          document.getElementById("racha").textContent = 0;
          mostrarFeedback("Ups...", "fail");
          sonido("fallo");
        }

        estado.respondidas++;

        setTimeout(() => siguientePregunta(), correcto ? 1800 : 2200);
      }

      // ============ SIGUIENTE ============
      function siguientePregunta() {
        estado.indice++;

        if (estado.indice >= PREGUNTAS.length) {
          mostrarFinal();
          return;
        }

        const wrap = document.getElementById("preguntaWrap");
        wrap.classList.add("saliendo");
        setTimeout(() => {
          renderPregunta();
        }, 500);
      }

      // ============ PANTALLA FINAL ============
      function mostrarFinal() {
        const wrap = document.getElementById("preguntaWrap");
        wrap.classList.add("saliendo");

        setTimeout(() => {
          wrap.classList.remove("saliendo");
          wrap.classList.add("entrando");

          const total = PREGUNTAS.length;
          const correctas = estado.correctas;
          const porcentaje = Math.round((correctas / total) * 100);

          // Medalla según porcentaje
          let medalla, mensaje;
          if (porcentaje === 100) {
            medalla = "🏆";
            mensaje = "¡Perfecto! Me conoces mejor que yo mismo. 💜";
          } else if (porcentaje >= 80) {
            medalla = "🥇";
            mensaje = "¡Increíble! Eres mi persona favorita. 💕";
          } else if (porcentaje >= 60) {
            medalla = "🥈";
            mensaje = "Muy bien. Aprendiste bien todos mis detalles.";
          } else if (porcentaje >= 40) {
            medalla = "🥉";
            mensaje = "Vas por buen camino, aún podemos mejorar.";
          } else {
            medalla = "💜";
            mensaje = "No importa el puntaje, lo importante es que estás aquí.";
          }

          wrap.innerHTML = `
            <div class="juego-final">
              <span class="medalla">${medalla}</span>
              <h2>¡Terminaste!</h2>
              <p class="final-sub">${mensaje}</p>

              <div class="final-stats">
                <div class="final-stat">
                  <span class="final-stat-label">Correctas</span>
                  <span class="final-stat-valor">${correctas}/${total}</span>
                </div>
                <div class="final-stat">
                  <span class="final-stat-label">Precisión</span>
                  <span class="final-stat-valor">${porcentaje}%</span>
                </div>
                <div class="final-stat">
                  <span class="final-stat-label">Puntos totales</span>
                  <span class="final-stat-valor">${getPuntos()}</span>
                </div>
              </div>

              <p class="final-mensaje">
                "Cada respuesta correcta es un pequeño recordatorio<br>
                de todo lo que hemos vivido juntos."
              </p>

              <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <button class="btn btn-primary" id="btnReiniciar" style="padding: 14px 32px; font-size: 0.78rem; letter-spacing: 3px;">
                  Jugar de nuevo
                </button>
                <a href="cuponera.html" class="btn btn-outline" style="padding: 14px 32px; font-size: 0.78rem; letter-spacing: 3px;">
                  Ir a la cuponera
                </a>
              </div>
            </div>
          `;

          // Confeti épico
          if (window.lanzarConfeti) window.lanzarConfeti(3000);

          document.getElementById("btnReiniciar").addEventListener("click", reiniciar);
        }, 500);
      }

      // ============ REINICIAR ============
      function reiniciar() {
        estado = {
          indice: 0,
          puntosSesion: 0,
          racha: 0,
          correctas: 0,
          respondidas: 0,
          respondiendo: false,
          tiempoRestante: TIEMPO_PREGUNTA,
          tiempoInterval: null
        };
        document.getElementById("racha").textContent = 0;
        renderPregunta();
      }

      // ============ INICIO ============
      document.addEventListener("DOMContentLoaded", () => {
        actualizarHUD();
        renderPregunta();
      });

    })();
  </script>
</body>
