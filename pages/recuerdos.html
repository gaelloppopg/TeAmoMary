    /* ============================================
       SECCIÓN DE VIDEOS — BURBUJAS FLOTANTES
       ============================================ */

    .sec-videos-nueva {
      max-width: 1300px;
      margin: 100px auto 140px;
      padding: 0 24px;
      position: relative;
    }

    .videos-titulo {
      text-align: center;
      margin-bottom: 80px;
      position: relative;
      z-index: 2;
    }
    .videos-titulo .kicker {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--dorado);
      font-weight: 500;
      margin-bottom: 22px;
      opacity: 0.8;
      position: relative;
      padding: 0 18px;
    }
    .videos-titulo .kicker::before,
    .videos-titulo .kicker::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 22px;
      height: 1px;
      background: var(--dorado);
      opacity: 0.5;
    }
    .videos-titulo .kicker::before { left: -14px; }
    .videos-titulo .kicker::after { right: -14px; }

    .videos-titulo h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 4.5vw, 3rem);
      color: var(--texto);
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 18px;
      line-height: 1.15;
    }
    .videos-titulo h2 em {
      font-style: italic;
      color: var(--rosa);
    }
    .videos-titulo .sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 1.15rem;
      color: var(--texto-suave);
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ============================================
       ESCENARIO DE BURBUJAS
       ============================================ */
    .burbujas-escenario {
      display: grid;
      grid-template-columns: 1fr;
      gap: 90px;
      position: relative;
      padding: 40px 0;
    }

    .burbuja-video {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: translateY(60px) scale(0.9);
      transition: opacity 1.4s ease, transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
      animation: flotarBurbuja 6s ease-in-out infinite;
    }
    .burbuja-video:nth-child(2) { animation-delay: -2s; animation-duration: 7s; }
    .burbuja-video:nth-child(3) { animation-delay: -4s; animation-duration: 8s; }
    .burbuja-video:nth-child(4) { animation-delay: -1s; animation-duration: 6.5s; }

    @keyframes flotarBurbuja {
      0%, 100% { transform: translateY(0) rotate(-0.5deg); }
      25% { transform: translateY(-14px) rotate(0.5deg); }
      50% { transform: translateY(-6px) rotate(-0.3deg); }
      75% { transform: translateY(-18px) rotate(0.6deg); }
    }

    .burbuja-video.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Cuando está "absorbiendo" el video que vuelve del modal */
    .burbuja-video.absorbiendo {
      animation-play-state: paused;
    }
    .burbuja-video.absorbiendo .burbuja-inner {
      animation: latidoAbsorcion 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes latidoAbsorcion {
      0% { transform: scale(1); }
      30% { transform: scale(1.12); box-shadow:
        0 0 100px rgba(242, 140, 166, 0.8),
        inset 0 0 120px rgba(242, 140, 166, 0.5); }
      60% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    /* Ripple de absorción */
    .ripple-absorcion {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .ripple-absorcion::before,
    .ripple-absorcion::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 100%;
      height: 100%;
      border-radius: 50% / 45%;
      border: 2px solid rgba(242, 140, 166, 0.9);
      opacity: 0;
      pointer-events: none;
    }
    .burbuja-video.absorbiendo .ripple-absorcion::before {
      animation: rippleAnima 1.2s ease-out;
    }
    .burbuja-video.absorbiendo .ripple-absorcion::after {
      animation: rippleAnima 1.2s ease-out 0.25s;
    }
    @keyframes rippleAnima {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
    }

    /* Burbuja interior */
    .burbuja-inner {
      position: absolute;
      inset: 0;
      border-radius: 50% / 45%;
      overflow: hidden;
      background: #030105;
      transition:
        border-radius 1.2s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 1.2s ease,
        transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow:
        0 30px 70px rgba(242, 140, 166, 0.25),
        0 10px 30px rgba(0, 0, 0, 0.3),
        inset 0 0 60px rgba(242, 140, 166, 0.15),
        inset 0 0 120px rgba(120, 40, 80, 0.25);
      isolation: isolate;
    }

    .burbuja-inner::before {
      content: "";
      position: absolute;
      top: 8%;
      left: 12%;
      width: 35%;
      height: 25%;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 255, 255, 0.35) 0%,
        rgba(255, 255, 255, 0.1) 40%,
        transparent 70%
      );
      border-radius: 50%;
      filter: blur(8px);
      z-index: 6;
      pointer-events: none;
    }

    .burbuja-inner::after {
      content: "";
      position: absolute;
      bottom: 14%;
      right: 18%;
      width: 12%;
      height: 8%;
      background: radial-gradient(
        ellipse at center,
        rgba(242, 140, 166, 0.5),
        transparent 70%
      );
      border-radius: 50%;
      filter: blur(6px);
      z-index: 6;
      pointer-events: none;
    }

    .burbuja-video:hover .burbuja-inner {
      box-shadow:
        0 40px 100px rgba(242, 140, 166, 0.45),
        0 15px 40px rgba(0, 0, 0, 0.35),
        inset 0 0 80px rgba(242, 140, 166, 0.25),
        inset 0 0 160px rgba(120, 40, 80, 0.35);
      transform: scale(1.02);
    }

    /* Video dentro */
    .burbuja-inner video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0;
      filter: blur(25px) brightness(0.2) saturate(0);
      transform: scale(1.15);
      transition:
        opacity 1.6s ease,
        filter 1.8s ease,
        transform 2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }
    .burbuja-video.revelado .burbuja-inner video {
      opacity: 1;
      filter: blur(0) brightness(1) saturate(1);
      transform: scale(1);
    }

    /* ============================================
       PORTADA MÍSTICA
       ============================================ */
    .burbuja-portada {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(20, 8, 15, 0.35), rgba(3, 1, 5, 0.92) 75%),
        linear-gradient(135deg, #050208 0%, #0d0510 50%, #050208 100%);
      transition:
        opacity 1.2s ease,
        transform 1.4s cubic-bezier(0.16, 1, 0.3, 1),
        filter 1.2s ease;
    }
    .burbuja-video.revelado .burbuja-portada {
      opacity: 0;
      transform: scale(1.15);
      filter: blur(15px);
      pointer-events: none;
    }

    .burbuja-portada::before {
      content: "";
      position: absolute;
      inset: -50%;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(255,255,255,0.05) 1px, transparent 1.5px),
        radial-gradient(circle at 80% 60%, rgba(242,140,166,0.07) 1px, transparent 1.5px),
        radial-gradient(circle at 40% 85%, rgba(255,255,255,0.03) 1px, transparent 1.5px);
      background-size: 55px 55px, 80px 80px, 100px 100px;
      opacity: 0.85;
      animation: granosMover 12s steps(14) infinite;
      pointer-events: none;
    }
    @keyframes granosMover {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-2%, 3%); }
      40%  { transform: translate(3%, -2%); }
      60%  { transform: translate(-3%, -1%); }
      80%  { transform: translate(2%, 2%); }
      100% { transform: translate(0, 0); }
    }

    .burbuja-contenido {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .burbuja-simbolo {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .anillo-b {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(242, 140, 166, 0.5);
      animation: anilloPulsoB 3.6s ease-in-out infinite;
    }
    .anillo-b:nth-child(1) { inset: 0; animation-delay: 0s; }
    .anillo-b:nth-child(2) { inset: 12px; animation-delay: 0.6s; }
    .anillo-b:nth-child(3) { inset: 24px; animation-delay: 1.2s; }
    @keyframes anilloPulsoB {
      0%, 100% {
        transform: scale(1);
        opacity: 0.55;
        box-shadow: 0 0 20px rgba(242, 140, 166, 0.2);
      }
      50% {
        transform: scale(1.18);
        opacity: 1;
        box-shadow: 0 0 45px rgba(242, 140, 166, 0.7),
                    inset 0 0 20px rgba(242, 140, 166, 0.25);
      }
    }

    .nucleo-b {
      position: relative;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #f28ca6 40%, rgba(242, 140, 166, 0) 80%);
      box-shadow:
        0 0 20px rgba(242, 140, 166, 0.9),
        0 0 45px rgba(242, 140, 166, 0.6),
        0 0 90px rgba(242, 140, 166, 0.35);
      animation: nucleoPulsoB 2.4s ease-in-out infinite;
    }
    @keyframes nucleoPulsoB {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    .burbuja-texto {
      font-family: 'Poppins', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(245, 230, 234, 0.75);
      font-weight: 400;
      animation: fadeTextoB 3.4s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(242, 140, 166, 0.5);
    }
    @keyframes fadeTextoB {
      0%, 100% { opacity: 0.5; letter-spacing: 7px; }
      50% { opacity: 1; letter-spacing: 9px; }
    }

    /* ============================================
       MINI BURBUJAS DECORATIVAS
       ============================================ */
    .mini-burbujas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }
    .mini-b {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        circle at 30% 30%,
        rgba(255, 255, 255, 0.4),
        rgba(242, 140, 166, 0.15) 40%,
        transparent 70%
      );
      border: 1px solid rgba(242, 140, 166, 0.25);
      box-shadow:
        inset 0 0 15px rgba(242, 140, 166, 0.3),
        0 0 20px rgba(242, 140, 166, 0.15);
      animation: flotarMini 5s ease-in-out infinite;
      opacity: 0.7;
    }
    @keyframes flotarMini {
      0%, 100% { transform: translateY(0) translateX(0); }
      25% { transform: translateY(-12px) translateX(5px); }
      50% { transform: translateY(-5px) translateX(-4px); }
      75% { transform: translateY(-15px) translateX(3px); }
    }

    /* ============================================
       MODAL PANTALLA COMPLETA
       ============================================ */
    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(3, 1, 5, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .video-modal.activo {
      opacity: 1;
      pointer-events: auto;
    }

    .video-modal::before {
      content: "";
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(242, 140, 166, 0.15), transparent 45%),
        radial-gradient(ellipse at 70% 60%, rgba(120, 40, 80, 0.12), transparent 50%);
      filter: blur(60px);
      animation: nieblaModal 18s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes nieblaModal {
      0% { transform: translate(-5%, -3%) scale(1); }
      100% { transform: translate(4%, 5%) scale(1.15); }
    }

.video-modal-inner {
  position: relative;
  width: auto;
  height: auto;
  max-width: 90vw;
  max-height: 88vh;
  border-radius: 20px;
  overflow: hidden;
  background: #000;
  box-shadow:
    0 40px 100px rgba(0, 0, 0, 0.9),
    0 0 120px rgba(242, 140, 166, 0.35);
  transform: scale(0.7) rotateX(15deg);
  opacity: 0;
  transition:
    transform 1s cubic-bezier(0.16, 1, 0.3, 1),
    opacity 0.8s ease;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
}
    .video-modal.activo .video-modal-inner {
      transform: scale(1) rotateX(0);
      opacity: 1;
    }

    /* Cuando se está cerrando → el modal encoge */
    .video-modal.cerrando .video-modal-inner {
      transform: scale(0.4) rotateX(-15deg);
      opacity: 0;
      transition:
        transform 0.9s cubic-bezier(0.7, 0, 0.84, 0),
        opacity 0.7s ease;
    }

    .video-modal-inner video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .video-modal-cerrar {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(242, 140, 166, 0.4);
      background: rgba(10, 5, 10, 0.7);
      backdrop-filter: blur(10px);
      color: #f28ca6;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 5;
      font-family: 'Poppins', sans-serif;
    }
    .video-modal-cerrar:hover {
      background: #f28ca6;
      color: #0a050a;
      transform: rotate(90deg) scale(1.05);
      box-shadow: 0 0 30px rgba(242, 140, 166, 0.6);
    }

    /* ============================================
       EXPLOSIÓN Y FLASH
       ============================================ */
    .explosion-canvas {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .burbuja-video.revelando .explosion-canvas {
      opacity: 1;
    }

    .flash-revelado {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.7), transparent 65%);
      z-index: 7;
      pointer-events: none;
      opacity: 0;
    }
    .burbuja-video.revelando .flash-revelado {
      animation: flashAnimB 1s ease-out;
    }
    @keyframes flashAnimB {
      0% { opacity: 0; }
      15% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 768px) {
      .sec-videos-nueva { padding: 0 16px; margin: 60px auto 90px; }
      .videos-titulo { margin-bottom: 50px; }
      .burbujas-escenario { gap: 60px; }
      .burbuja-video { max-width: 100%; }
      .burbuja-inner { border-radius: 45% / 40%; }
      .burbuja-simbolo { width: 70px; height: 70px; }
      .burbuja-texto { font-size: 0.6rem; letter-spacing: 5px; }
      .video-modal { padding: 15px; }
      .video-modal-cerrar { top: 14px; right: 14px; width: 44px; height: 44px; font-size: 1.2rem; }
    }
  </style>
</head>

  <canvas id="confetiCanvas" class="confeti-canvas"></canvas>
  <script src="../js/script.js"></script>
  <script src="../js/galeria.js"></script>

  <script src="../js/video-musica.js"></script>

  <script src="../js/pwa.js"></script>

  <script>
    /* ============================================
       BURBUJAS + MODAL CINEMATOGRÁFICO
       ============================================ */

    (function () {

      function crearMiniBurbujas(contenedor) {
        const cantidad = 6;
        for (let i = 0; i < cantidad; i++) {
          const b = document.createElement("div");
          b.className = "mini-b";
          const size = Math.random() * 30 + 10;
          b.style.width = size + "px";
          b.style.height = size + "px";
          const angulo = (Math.PI * 2 * i) / cantidad + Math.random() * 0.5;
          const radio = 52 + Math.random() * 15;
          const cx = 50 + Math.cos(angulo) * radio;
          const cy = 50 + Math.sin(angulo) * (radio * 0.7);
          b.style.left = cx + "%";
          b.style.top = cy + "%";
          b.style.transform = "translate(-50%, -50%)";
          b.style.animationDelay = (Math.random() * 4) + "s";
          b.style.animationDuration = (4 + Math.random() * 4) + "s";
          contenedor.appendChild(b);
        }
      }

      function explosion(canvas) {
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        ctx.scale(devicePixelRatio, devicePixelRatio);

        const w = rect.width;
        const h = rect.height;
        const cx = w / 2;
        const cy = h / 2;

        const particles = [];
        const TOTAL = 70;

        for (let i = 0; i < TOTAL; i++) {
          const angle = (Math.PI * 2 * i) / TOTAL + Math.random() * 0.4;
          const speed = Math.random() * 6 + 3;
          particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: Math.random() * 3.5 + 1,
            vida: 1,
            hue: Math.random() < 0.6 ? "242, 140, 166" : "255, 255, 255"
          });
        }

        const start = performance.now();
        const DURACION = 1500;

        function animate(now) {
          const t = (now - start) / DURACION;
          ctx.clearRect(0, 0, w, h);
          if (t >= 1) { canvas.style.opacity = "0"; return; }

          particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.95; p.vy *= 0.95;
            p.vida = 1 - t;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * p.vida, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.hue}, ${p.vida})`;
            ctx.shadowBlur = 18;
            ctx.shadowColor = `rgba(${p.hue}, ${p.vida})`;
            ctx.fill();
          });
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      }

      // ========== MODAL ==========
      const modal = document.getElementById("videoModal");
      const modalPlayer = document.getElementById("videoModalPlayer");
      const modalCerrar = document.getElementById("videoModalCerrar");

      let burbujaActiva = null;

      function abrirModal(src, burbuja) {
        burbujaActiva = burbuja;
        modalPlayer.src = src;
        modal.classList.add("activo");
        document.body.style.overflow = "hidden";
        setTimeout(() => {
          modalPlayer.play().catch(() => {});
        }, 500);
      }

      function cerrarModal() {
        if (!modal.classList.contains("activo")) return;

        // 1. Activar clase de "cerrando" → el modal se encoge
        modal.classList.add("cerrando");
        modalPlayer.pause();

        // 2. La burbuja empieza a "absorber"
        if (burbujaActiva) {
          // Devolvemos el video a la burbuja
          const videoBurbuja = burbujaActiva.querySelector("video");
          if (videoBurbuja) {
            // Sincronizar el tiempo si quieres que continúe
            // videoBurbuja.currentTime = modalPlayer.currentTime;
          }

          // Añadir clase de absorción tras un pequeño delay
          setTimeout(() => {
            burbujaActiva.classList.add("absorbiendo");
            // Scroll suave hacia la burbuja
            burbujaActiva.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 400);

          // Quitar clase absorbiendo después de la animación
          setTimeout(() => {
            burbujaActiva.classList.remove("absorbiendo");
          }, 1800);
        }

        // 3. Cerrar modal después
        setTimeout(() => {
          modal.classList.remove("activo");
          modal.classList.remove("cerrando");
          document.body.style.overflow = "";

          setTimeout(() => {
            modalPlayer.removeAttribute("src");
            modalPlayer.load();
          }, 600);
        }, 900);

        burbujaActiva = null;
      }

      modalCerrar.addEventListener("click", cerrarModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) cerrarModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("activo")) cerrarModal();
      });

      // ========== INICIALIZACIÓN ==========
      document.addEventListener("DOMContentLoaded", () => {

        const burbujas = document.querySelectorAll("[data-video]");

        burbujas.forEach(burbuja => {
          const miniCont = burbuja.querySelector(".mini-burbujas");
          if (miniCont) crearMiniBurbujas(miniCont);

          const video = burbuja.querySelector("video");
          const explosionCanvas = burbuja.querySelector(".explosion-canvas");

          if (!video) return;

          video.removeAttribute("controls");
          video.controls = false;
          video.pause();

          burbuja.addEventListener("click", () => {
            if (burbuja.classList.contains("revelando") || burbuja.classList.contains("revelado")) {
              const src = video.querySelector("source")?.src;
              if (src) abrirModal(src, burbuja);
              return;
            }

            burbuja.classList.add("revelando");
            if (explosionCanvas) explosion(explosionCanvas);

            video.muted = true;
            video.play().catch(() => {});

            setTimeout(() => {
              burbuja.classList.remove("revelando");
              burbuja.classList.add("revelado");
              video.pause();
              video.currentTime = 0;
              video.muted = false;

              const src = video.querySelector("source")?.src;
              if (src) abrirModal(src, burbuja);
            }, 900);
          });
        });

        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) e.target.classList.add("visible");
          });
        }, { threshold: 0.15 });

        burbujas.forEach(b => io.observe(b));

      });

    })();
  </script>
