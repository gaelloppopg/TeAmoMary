<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Recuerdos 📸</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#f28ca6" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />

  <script>
    (function() {
      const ok = localStorage.getItem("auth_novia_ok");
      const t = parseInt(localStorage.getItem("auth_novia_time") || "0", 10);
      const valido = ok === "true" && (Date.now() - t) < 60 * 60 * 1000;
      if (!valido) location.replace("../login.html");
    })();
  </script>

  <style>
    /* ============================================
       VIDEOS EN BURBUJAS
       ============================================ */
    .sec-videos-nueva { max-width: 1300px; margin: 100px auto 140px; padding: 0 24px; position: relative; }
    .videos-titulo { text-align: center; margin-bottom: 80px; position: relative; z-index: 2; }
    .videos-titulo .kicker {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #d4a373;
      font-weight: 500;
      margin-bottom: 22px;
      opacity: 0.8;
      position: relative;
      padding: 0 18px;
    }
    .videos-titulo .kicker::before,
    .videos-titulo .kicker::after {
      content: ""; position: absolute; top: 50%; width: 22px; height: 1px;
      background: #d4a373; opacity: 0.5;
    }
    .videos-titulo .kicker::before { left: -14px; }
    .videos-titulo .kicker::after { right: -14px; }
    .videos-titulo h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 4.5vw, 3rem);
      color: #3a2145;
      font-weight: 400;
      margin-bottom: 18px;
      line-height: 1.15;
    }
    .videos-titulo h2 em { font-style: italic; color: #f28ca6; }
    .videos-titulo .sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 1.15rem;
      color: #7a5c8c;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .burbujas-escenario { display: grid; grid-template-columns: 1fr; gap: 90px; position: relative; padding: 40px 0; }
    .burbuja-video {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      cursor: pointer;
      user-select: none;
      opacity: 0;
      transform: translateY(60px) scale(0.9);
      transition: opacity 1.4s ease, transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
      animation: flotarBurbuja 6s ease-in-out infinite;
    }
    .burbuja-video:nth-child(2) { animation-delay: -2s; animation-duration: 7s; }
    .burbuja-video:nth-child(3) { animation-delay: -4s; animation-duration: 8s; }
    .burbuja-video:nth-child(4) { animation-delay: -1s; animation-duration: 6.5s; }
    @keyframes flotarBurbuja {
      0%, 100% { transform: translateY(0) rotate(-0.5deg); }
      25% { transform: translateY(-14px) rotate(0.5deg); }
      50% { transform: translateY(-6px) rotate(-0.3deg); }
      75% { transform: translateY(-18px) rotate(0.6deg); }
    }
    .burbuja-video.visible { opacity: 1; transform: translateY(0) scale(1); }
    .burbuja-inner {
      position: absolute;
      inset: 0;
      border-radius: 50% / 45%;
      overflow: hidden;
      background: #030105;
      transition: border-radius 1.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 1.2s ease, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 30px 70px rgba(242, 140, 166, 0.25), 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 60px rgba(242, 140, 166, 0.15);
      isolation: isolate;
    }
    .burbuja-inner::before {
      content: "";
      position: absolute;
      top: 8%; left: 12%; width: 35%; height: 25%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.35), transparent 70%);
      border-radius: 50%;
      filter: blur(8px);
      z-index: 6;
      pointer-events: none;
    }
    .burbuja-video:hover .burbuja-inner {
      box-shadow: 0 40px 100px rgba(242, 140, 166, 0.45), 0 15px 40px rgba(0, 0, 0, 0.35), inset 0 0 80px rgba(242, 140, 166, 0.25);
      transform: scale(1.02);
    }
    .burbuja-inner video,
    .burbuja-inner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0;
      filter: blur(25px) brightness(0.2) saturate(0);
      transform: scale(1.15);
      transition: opacity 1.6s ease, filter 1.8s ease, transform 2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }
    .burbuja-video.revelado .burbuja-inner video,
    .burbuja-video.revelado .burbuja-inner img {
      opacity: 1;
      filter: blur(0) brightness(1) saturate(1);
      transform: scale(1);
    }
    .burbuja-portada {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: radial-gradient(ellipse at 50% 50%, rgba(20, 8, 15, 0.35), rgba(3, 1, 5, 0.92) 75%), linear-gradient(135deg, #050208, #0d0510 50%, #050208);
      transition: opacity 1.2s ease, transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), filter 1.2s ease;
    }
    .burbuja-video.revelado .burbuja-portada {
      opacity: 0;
      transform: scale(1.15);
      filter: blur(15px);
      pointer-events: none;
    }
    .burbuja-contenido {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .burbuja-simbolo { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; }
    .anillo-b {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(242, 140, 166, 0.5);
      animation: anilloPulsoB 3.6s ease-in-out infinite;
    }
    .anillo-b:nth-child(1) { inset: 0; }
    .anillo-b:nth-child(2) { inset: 12px; animation-delay: 0.6s; }
    .anillo-b:nth-child(3) { inset: 24px; animation-delay: 1.2s; }
    @keyframes anilloPulsoB {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.18); opacity: 1; box-shadow: 0 0 45px rgba(242, 140, 166, 0.7); }
    }
    .nucleo-b {
      width: 20px; height: 20px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #f28ca6 40%, rgba(242, 140, 166, 0) 80%);
      box-shadow: 0 0 20px rgba(242, 140, 166, 0.9), 0 0 45px rgba(242, 140, 166, 0.6);
      animation: nucleoPulsoB 2.4s ease-in-out infinite;
    }
    @keyframes nucleoPulsoB {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .burbuja-texto {
      font-family: 'Poppins', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(245, 230, 234, 0.75);
      animation: fadeTextoB 3.4s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(242, 140, 166, 0.5);
    }
    @keyframes fadeTextoB {
      0%, 100% { opacity: 0.5; letter-spacing: 7px; }
      50% { opacity: 1; letter-spacing: 9px; }
    }
    .burbuja-eliminar {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(217, 102, 102, 0.85);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 15;
      opacity: 0;
    }
    .burbuja-video:hover .burbuja-eliminar { opacity: 1; }
    .burbuja-eliminar:hover { background: #d96666; transform: scale(1.15); }
    .ripple-absorcion { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    .ripple-absorcion::before,
    .ripple-absorcion::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 100%; height: 100%;
      border-radius: 50% / 45%;
      border: 2px solid rgba(242, 140, 166, 0.9);
      opacity: 0;
    }
    .burbuja-video.absorbiendo .ripple-absorcion::before { animation: rippleAnima 1.2s ease-out; }
    .burbuja-video.absorbiendo .ripple-absorcion::after { animation: rippleAnima 1.2s ease-out 0.25s; }
    @keyframes rippleAnima {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
    }
    .explosion-canvas { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
    .burbuja-video.revelando .explosion-canvas { opacity: 1; }
    .flash-revelado {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.7), transparent 65%);
      z-index: 7;
      pointer-events: none;
      opacity: 0;
    }
    .burbuja-video.revelando .flash-revelado { animation: flashAnimB 1s ease-out; }
    @keyframes flashAnimB { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

    /* MODAL VIDEOS — CORREGIDO: CENTRADO Y AJUSTADO AL TAMAÑO DE PANTALLA */
    .video-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 9999;
      background: rgba(3, 1, 5, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      backdrop-filter: blur(20px);
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    .video-modal.activo { opacity: 1; pointer-events: auto; }
    .video-modal-inner {
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: 100%;
      height: 100%;
      border-radius: 0;
      overflow: hidden;
      background: #000;
      transform: scale(0.7) rotateX(15deg);
      opacity: 0;
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-modal.activo .video-modal-inner { transform: scale(1) rotateX(0); opacity: 1; }
    .video-modal-inner video,
    .video-modal-inner img {
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
      margin: auto;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      pointer-events: auto;
    }
    .video-modal-cerrar {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: 16px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(242, 140, 166, 0.4);
      background: rgba(10, 5, 10, 0.7);
      backdrop-filter: blur(10px);
      color: #f28ca6;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }
    .video-modal-cerrar:hover { background: #f28ca6; color: #0a050a; transform: rotate(90deg) scale(1.05); }

    /* GALERÍA */
    .galeria {
      max-width: 1200px;
      margin: 0 auto 40px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .galeria-item {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(242, 140, 166, 0.15);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      margin: 0;
      position: relative;
    }
    .galeria-item:hover { transform: translateY(-6px); box-shadow: 0 20px 45px rgba(242, 140, 166, 0.3); }
    .galeria-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .galeria-item:hover img { transform: scale(1.05); }
    .galeria-item figcaption {
      padding: 20px 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #fff;
      position: relative;
    }
    .galeria-item .recuerdo-fecha {
      font-family: 'Poppins', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #f28ca6;
      text-transform: uppercase;
      margin: 0;
    }
    .galeria-item .recuerdo-texto {
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      color: #6b5560;
      line-height: 1.5;
      margin: 0;
      font-weight: 300;
    }
    .btn-eliminar-recuerdo {
      position: absolute;
      bottom: 15px;
      right: 15px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(217, 102, 102, 0.15);
      color: #d96666;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
    }
    .galeria-item:hover .btn-eliminar-recuerdo { opacity: 1; }
    .btn-eliminar-recuerdo:hover { background: #d96666; color: #fff; transform: scale(1.15); }

    /* BOTONES */
    .btn-agregar-galeria {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #f28ca6, #d4a373);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 24px rgba(242, 140, 166, 0.4);
    }
    .btn-agregar-galeria:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 34px rgba(242, 140, 166, 0.6); }

    /* FILTROS */
    .filtros-barra {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-end;
      padding: 22px 26px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(160, 100, 220, 0.12);
      border: 1px solid rgba(242, 140, 166, 0.15);
      margin-bottom: 20px;
    }
    .filtro-grupo { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
    .filtro-busqueda { flex: 2; min-width: 240px; }
    .filtro-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8a7aa8; }
    .filtro-select, .filtro-input {
      padding: 10px 14px;
      border: 1.5px solid rgba(180, 130, 240, 0.25);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      color: #3a2145;
      outline: none;
      background: #fff;
      transition: all 0.3s ease;
    }
    .filtro-select:focus, .filtro-input:focus { border-color: #a874e8; box-shadow: 0 0 0 3px rgba(168, 116, 232, 0.12); }
    .btn-nuevo-album {
      padding: 10px 22px;
      background: linear-gradient(135deg, #a874e8, #d4a373);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      height: fit-content;
    }
    .btn-nuevo-album:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(168, 116, 232, 0.4); }

    .albums-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; padding: 0 4px; }
    .album-chip {
      padding: 8px 18px;
      background: #fff;
      border: 1.5px solid rgba(180, 130, 240, 0.25);
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      color: #7a5c8c;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .album-chip:hover { border-color: #a874e8; transform: translateY(-2px); }
    .album-chip.activo { background: linear-gradient(135deg, #a874e8, #d4a373); color: #fff; border-color: transparent; box-shadow: 0 8px 20px rgba(168, 116, 232, 0.35); }

    /* LIGHTBOX — CORREGIDO: CENTRADO Y AJUSTADO AL TAMAÑO DE PANTALLA */
    .lightbox-galeria {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      animation: fadeInLightbox 0.4s ease forwards;
      cursor: zoom-out;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    @keyframes fadeInLightbox { to { opacity: 1; } }
    .lightbox-contenido {
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .lightbox-contenido img {
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0;
      box-shadow: none;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      pointer-events: auto;
      margin: auto;
    }
    .lightbox-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      text-align: center;
      line-height: 1.5;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      pointer-events: none;
    }
    .lightbox-cerrar {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: 16px;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }
    .lightbox-cerrar:hover { background: rgba(255, 255, 255, 0.3); transform: rotate(90deg); }
    .lightbox-eliminar {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 16px;
      padding: 12px 20px;
      border-radius: 50px;
      background: rgba(217, 102, 102, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }
    .lightbox-eliminar:hover { background: #d96666; transform: scale(1.05); }

    /* MODAL SUBIDA */
    .subida-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(60, 30, 90, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(14px);
      overflow-y: auto;
    }
    .subida-modal.activo { opacity: 1; pointer-events: auto; }
    .subida-papel {
      background: #fff;
      border-radius: 24px;
      padding: 40px 35px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.3);
      position: relative;
      transform: scale(0.9);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      margin: auto;
    }
    .subida-modal.activo .subida-papel { transform: scale(1); }
    .subida-cerrar {
      position: absolute;
      top: 15px; right: 15px;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(242, 140, 166, 0.15);
      color: #a874e8;

      data-cancion-titulo="Nuestra Canción"

  <canvas id="confetiCanvas" class="confeti-canvas"></canvas>

  <!-- ============================================
       SCRIPT DE BURBUJAS DE VIDEO
       ============================================ -->
  <script>
    (function () {
      "use strict";

      const JSONBIN_MASTER_KEY = "$2a$10$o5/KkktxRiEfoxN33ZQQieN0iUvv/pkvIG8riNohEo5N4I7NCGU2q";
      const JSONBIN_BIN_ID = "6aa58aecffd5d16053fef5c0";
      const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;

      const VIDEOS_ORIGINALES_BASE = [
        { id: "orig-vid-1", titulo: "Recuerdo 1", url: "../assets/videos/recuerdo.mp4", tipo: "video", fecha: "2026-09-11T00:00:00.000Z", autor: "Gael", esOriginal: true },
        { id: "orig-vid-2", titulo: "Recuerdo 2", url: "../assets/videos/recuerdo2.mp4", tipo: "video", fecha: "2026-09-11T00:00:00.000Z", autor: "Gael", esOriginal: true },
        { id: "orig-vid-3", titulo: "Recuerdo 3", url: "../assets/videos/recuerdo3.mp4", tipo: "video", fecha: "2026-09-11T00:00:00.000Z", autor: "Gael", esOriginal: true }
      ];

      function getEliminados() {
        try { return JSON.parse(localStorage.getItem("recuerdos_eliminados") || "[]"); }
        catch { return []; }
      }

      function claveMes(fechaISO) {
        const fecha = new Date(fechaISO);
        return fecha.getFullYear() + "-" + String(fecha.getMonth() + 1).padStart(2, "0");
      }

      function crearMiniBurbujas(contenedor) {
        for (let i = 0; i < 6; i++) {
          const b = document.createElement("div");
          b.className = "mini-b";
          const size = Math.random() * 30 + 10;
          b.style.cssText = `position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(242,140,166,0.15) 40%, transparent 70%);border:1px solid rgba(242,140,166,0.25);box-shadow:inset 0 0 15px rgba(242,140,166,0.3);animation:flotarMini 5s ease-in-out infinite;opacity:0.7;`;
          b.style.width = size + "px";
          b.style.height = size + "px";
          const angulo = (Math.PI * 2 * i) / 6 + Math.random() * 0.5;
          const radio = 52 + Math.random() * 15;
          b.style.left = (50 + Math.cos(angulo) * radio) + "%";
          b.style.top = (50 + Math.sin(angulo) * (radio * 0.7)) + "%";
          b.style.transform = "translate(-50%, -50%)";
          b.style.animationDelay = (Math.random() * 4) + "s";
          contenedor.appendChild(b);
        }
      }

      function explosion(canvas) {
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        ctx.scale(devicePixelRatio, devicePixelRatio);
        const w = rect.width, h = rect.height;
        const particles = [];
        for (let i = 0; i < 70; i++) {
          const angle = (Math.PI * 2 * i) / 70 + Math.random() * 0.4;
          const speed = Math.random() * 6 + 3;
          particles.push({
            x: w / 2, y: h / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: Math.random() * 3.5 + 1,
            vida: 1,
            hue: Math.random() < 0.6 ? "242, 140, 166" : "255, 255, 255"
          });
        }
        const start = performance.now();
        function animate(now) {
          const t = (now - start) / 1500;
          ctx.clearRect(0, 0, w, h);
          if (t >= 1) { canvas.style.opacity = "0"; return; }
          particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.95; p.vy *= 0.95;
            p.vida = 1 - t;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * p.vida, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.hue}, ${p.vida})`;
            ctx.shadowBlur = 18;
            ctx.shadowColor = `rgba(${p.hue}, ${p.vida})`;
            ctx.fill();
          });
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      }

      const modal = document.getElementById("videoModal");
      const modalInner = document.getElementById("videoModalInner");
      const modalCerrar = document.getElementById("videoModalCerrar");
      let burbujaActiva = null;
      let playerActivo = null;

      function abrirModal(item, burbuja) {
        burbujaActiva = burbuja;
        modalInner.innerHTML = "";
        if (item.tipo === "video") {
          playerActivo = document.createElement("video");
          playerActivo.src = item.url;
          playerActivo.controls = true;
          playerActivo.playsInline = true;
        } else {
          playerActivo = document.createElement("img");
          playerActivo.src = item.url;
        }
        modalInner.appendChild(playerActivo);
        modal.classList.add("activo");
        document.body.style.overflow = "hidden";
        setTimeout(() => {
          if (item.tipo === "video" && playerActivo.play) playerActivo.play().catch(() => {});
        }, 500);
      }

      function cerrarModal() {
        if (!modal.classList.contains("activo")) return;
        if (playerActivo && playerActivo.pause) playerActivo.pause();
        if (burbujaActiva) {
          setTimeout(() => {
            burbujaActiva.classList.add("absorbiendo");
            burbujaActiva.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 400);
          setTimeout(() => burbujaActiva.classList.remove("absorbiendo"), 1800);
        }
        setTimeout(() => {
          modal.classList.remove("activo");
          document.body.style.overflow = "";
          setTimeout(() => { modalInner.innerHTML = ""; playerActivo = null; }, 600);
        }, 900);
        burbujaActiva = null;
      }

      modalCerrar.addEventListener("click", cerrarModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) cerrarModal(); });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("activo")) cerrarModal();
      });

      // Prevenir gestos que muevan el modal
      ["touchmove", "gesturestart", "gesturechange", "gestureend"].forEach(evt => {
        modal.addEventListener(evt, (e) => {
          if (e.target === modal) e.preventDefault();
        }, { passive: false });
      });

      // Eliminar video
      async function eliminarVideo(itemId) {
        if (!confirm("¿Eliminar este video? No se puede recuperar 💜")) return;

        // Video original
        if (itemId.startsWith("orig-vid-")) {
          const eliminados = getEliminados();
          if (!eliminados.includes(itemId)) {
            eliminados.push(itemId);
            localStorage.setItem("recuerdos_eliminados", JSON.stringify(eliminados));
          }
          if (window.lanzarConfeti) window.lanzarConfeti(800);
          renderizarBurbujas();
          alert("✅ Video eliminado");
          return;
        }

        // Video subido
        try {
          const res = await fetch(JSONBIN_URL + "/latest", {
            headers: { "X-Master-Key": JSONBIN_MASTER_KEY, "X-Bin-Meta": "false" }
          });
          const data = await res.json();
          const nuevo = {
            entradas: data.entradas || [],
            suscripciones: data.suscripciones || [],
            recuerdos: (data.recuerdos || []).filter(r => r.id !== itemId),
            razones: data.razones || [],
            albums: data.albums || []
          };
          await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_MASTER_KEY },
            body: JSON.stringify(nuevo)
          });
          if (window.lanzarConfeti) window.lanzarConfeti(800);
          renderizarBurbujas();
          if (window.galeriaUsuario) {
            window.galeriaUsuario.cargarDatos().then(() => {
              window.galeriaUsuario.renderizarRecuerdos();
            });
          }
          alert("✅ Video eliminado");
        } catch (err) {
          alert("❌ Error: " + err.message);
        }
      }
      window.eliminarVideo = eliminarVideo;

      async function renderizarBurbujas() {
        const escenario = document.getElementById("burbujasEscenario");
        if (!escenario) return;

        try {
          const res = await fetch(JSONBIN_URL + "/latest", {
            headers: { "X-Master-Key": JSONBIN_MASTER_KEY, "X-Bin-Meta": "false" }
          });
          if (!res.ok) throw new Error("Error cargando");
          const data = await res.json();

          let videos = (data.recuerdos || []).filter(r => r.tipo === "video");

          const filtros = window.galeriaUsuario ? window.galeriaUsuario.getFiltros() : { album: "sin-album", fecha: "todas", busqueda: "" };

          // Búsqueda global
          if (filtros.busqueda && filtros.busqueda.trim()) {
            const q = filtros.busqueda.trim().toLowerCase();
            videos = videos.filter(v =>
              (v.titulo || "").toLowerCase().includes(q) ||
              (v.descripcion || "").toLowerCase().includes(q)
            );
          } else {
            // Álbum
            if (filtros.album === "sin-album") {
              videos = videos.filter(v => !v.albumId);
            } else if (filtros.album && filtros.album !== "") {
              videos = videos.filter(v => v.albumId === filtros.album);
            }
          }

          // Fecha
          if (filtros.fecha && filtros.fecha !== "todas") {
            videos = videos.filter(v => claveMes(v.fecha) === filtros.fecha);
          }

          // Videos originales (sin filtros de álbum/fecha/búsqueda)
          const sinFiltros = 
            filtros.album === "sin-album" && 
            filtros.fecha === "todas" &&
            (!filtros.busqueda || !filtros.busqueda.trim());

          if (sinFiltros) {
            const eliminados = getEliminados();
            const originalesFiltrados = VIDEOS_ORIGINALES_BASE.filter(v => !eliminados.includes(v.id));
            videos = [...videos, ...originalesFiltrados];
          }

          if (videos.length === 0) {
            escenario.innerHTML = `
              <div style="text-align:center;padding:60px 20px;color:#a08bb8;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;">
                <strong style="display:block;font-family:'Playfair Display',serif;font-style:normal;font-size:1.5rem;color:#a874e8;margin-bottom:10px;">No hay videos con estos filtros</strong>
                Probá con otros filtros o subí un video 💜
              </div>
            `;
            return;
          }

          escenario.innerHTML = videos.map((video) => `
            <div class="burbuja-video" data-video data-id="${video.id}">
              <div class="mini-burbujas"></div>
              <div class="burbuja-inner">
                <video preload="metadata" playsinline muted>
                  <source src="${video.url}" type="video/mp4">
                </video>
                <div class="burbuja-portada">
                  <div class="burbuja-contenido">
                    <div class="burbuja-simbolo">
                      <div class="anillo-b"></div>
                      <div class="anillo-b"></div>
                      <div class="anillo-b"></div>
                      <div class="nucleo-b"></div>
                    </div>
                    <div class="burbuja-texto">Toca para revelar</div>
                  </div>
                </div>
              </div>
              <button class="burbuja-eliminar" onclick="event.stopPropagation(); eliminarVideo('${video.id}')" title="Eliminar">🗑️</button>
              <div class="ripple-absorcion"></div>
              <canvas class="explosion-canvas"></canvas>
              <div class="flash-revelado"></div>
            </div>
          `).join("");

          const burbujas = escenario.querySelectorAll("[data-video]");
          burbujas.forEach(burbuja => {
            const miniCont = burbuja.querySelector(".mini-burbujas");
            if (miniCont) crearMiniBurbujas(miniCont);
            const video = burbuja.querySelector("video");
            const explosionCanvas = burbuja.querySelector(".explosion-canvas");
            const id = burbuja.dataset.id;
            const item = videos.find(v => v.id === id);
            if (!video || !item) return;

            video.removeAttribute("controls");
            video.pause();

            burbuja.addEventListener("click", () => {
              if (burbuja.classList.contains("revelando") || burbuja.classList.contains("revelado")) {
                abrirModal(item, burbuja);
                return;
              }
              burbuja.classList.add("revelando");
              if (explosionCanvas) explosion(explosionCanvas);
              video.muted = true;
              video.play().catch(() => {});
              setTimeout(() => {
                burbuja.classList.remove("revelando");
                burbuja.classList.add("revelado");
                video.pause();
                video.currentTime = 0;
                video.muted = false;
                abrirModal(item, burbuja);
              }, 900);
            });
          });

          const io = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
          }, { threshold: 0.15 });
          burbujas.forEach(b => io.observe(b));

        } catch (err) {
          console.error("Error:", err);
        }
      }

      window.renderizarBurbujasVideos = renderizarBurbujas;

      window.addEventListener("filtrosCambiados", () => {
        renderizarBurbujas();
      });

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => renderizarBurbujas(), 1200);
      });
    })();
  </script>
