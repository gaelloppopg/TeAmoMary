<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuerdos 📸</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#f28ca6" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />

  <script>
    (function() {
      const ok = localStorage.getItem("auth_novia_ok");
      const t = parseInt(localStorage.getItem("auth_novia_time") || "0", 10);
      const valido = ok === "true" && (Date.now() - t) < 60 * 60 * 1000;
      if (!valido) location.replace("../login.html");
    })();
  </script>

  <style>
    /* ============================================
       VIDEOS EN BURBUJAS FLOTANTES
       ============================================ */
    .sec-videos-nueva {
      max-width: 1300px;
      margin: 100px auto 140px;
      padding: 0 24px;
      position: relative;
    }

    .videos-titulo {
      text-align: center;
      margin-bottom: 80px;
      position: relative;
      z-index: 2;
    }
    .videos-titulo .kicker {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--dorado, #d4a373);
      font-weight: 500;
      margin-bottom: 22px;
      opacity: 0.8;
      position: relative;
      padding: 0 18px;
    }
    .videos-titulo .kicker::before,
    .videos-titulo .kicker::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 22px;
      height: 1px;
      background: #d4a373;
      opacity: 0.5;
    }
    .videos-titulo .kicker::before { left: -14px; }
    .videos-titulo .kicker::after { right: -14px; }

    .videos-titulo h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 4.5vw, 3rem);
      color: #3a2145;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 18px;
      line-height: 1.15;
    }
    .videos-titulo h2 em {
      font-style: italic;
      color: #f28ca6;
    }
    .videos-titulo .sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 1.15rem;
      color: #7a5c8c;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Grid de burbujas */
    .burbujas-escenario {
      display: grid;
      grid-template-columns: 1fr;
      gap: 90px;
      position: relative;
      padding: 40px 0;
    }

    .burbuja-video {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: translateY(60px) scale(0.9);
      transition: opacity 1.4s ease, transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
      animation: flotarBurbuja 6s ease-in-out infinite;
    }
    .burbuja-video:nth-child(2) { animation-delay: -2s; animation-duration: 7s; }
    .burbuja-video:nth-child(3) { animation-delay: -4s; animation-duration: 8s; }
    .burbuja-video:nth-child(4) { animation-delay: -1s; animation-duration: 6.5s; }

    @keyframes flotarBurbuja {
      0%, 100% { transform: translateY(0) rotate(-0.5deg); }
      25% { transform: translateY(-14px) rotate(0.5deg); }
      50% { transform: translateY(-6px) rotate(-0.3deg); }
      75% { transform: translateY(-18px) rotate(0.6deg); }
    }

    .burbuja-video.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .burbuja-inner {
      position: absolute;
      inset: 0;
      border-radius: 50% / 45%;
      overflow: hidden;
      background: #030105;
      transition: border-radius 1.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 1.2s ease, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 30px 70px rgba(242, 140, 166, 0.25), 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 60px rgba(242, 140, 166, 0.15), inset 0 0 120px rgba(120, 40, 80, 0.25);
      isolation: isolate;
    }

    .burbuja-inner::before {
      content: "";
      position: absolute;
      top: 8%;
      left: 12%;
      width: 35%;
      height: 25%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.1) 40%, transparent 70%);
      border-radius: 50%;
      filter: blur(8px);
      z-index: 6;
      pointer-events: none;
    }

    .burbuja-video:hover .burbuja-inner {
      box-shadow: 0 40px 100px rgba(242, 140, 166, 0.45), 0 15px 40px rgba(0, 0, 0, 0.35), inset 0 0 80px rgba(242, 140, 166, 0.25), inset 0 0 160px rgba(120, 40, 80, 0.35);
      transform: scale(1.02);
    }

    /* Video o imagen dentro */
    .burbuja-inner video,
    .burbuja-inner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0;
      filter: blur(25px) brightness(0.2) saturate(0);
      transform: scale(1.15);
      transition: opacity 1.6s ease, filter 1.8s ease, transform 2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }
    .burbuja-video.revelado .burbuja-inner video,
    .burbuja-video.revelado .burbuja-inner img {
      opacity: 1;
      filter: blur(0) brightness(1) saturate(1);
      transform: scale(1);
    }

    /* Portada de la burbuja */
    .burbuja-portada {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: radial-gradient(ellipse at 50% 50%, rgba(20, 8, 15, 0.35), rgba(3, 1, 5, 0.92) 75%), linear-gradient(135deg, #050208 0%, #0d0510 50%, #050208 100%);
      transition: opacity 1.2s ease, transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), filter 1.2s ease;
    }
    .burbuja-video.revelado .burbuja-portada {
      opacity: 0;
      transform: scale(1.15);
      filter: blur(15px);
      pointer-events: none;
    }

    .burbuja-contenido {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .burbuja-simbolo {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .anillo-b {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(242, 140, 166, 0.5);
      animation: anilloPulsoB 3.6s ease-in-out infinite;
    }
    .anillo-b:nth-child(1) { inset: 0; animation-delay: 0s; }
    .anillo-b:nth-child(2) { inset: 12px; animation-delay: 0.6s; }
    .anillo-b:nth-child(3) { inset: 24px; animation-delay: 1.2s; }
    @keyframes anilloPulsoB {
      0%, 100% { transform: scale(1); opacity: 0.55; box-shadow: 0 0 20px rgba(242, 140, 166, 0.2); }
      50% { transform: scale(1.18); opacity: 1; box-shadow: 0 0 45px rgba(242, 140, 166, 0.7), inset 0 0 20px rgba(242, 140, 166, 0.25); }
    }

    .nucleo-b {
      position: relative;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #f28ca6 40%, rgba(242, 140, 166, 0) 80%);
      box-shadow: 0 0 20px rgba(242, 140, 166, 0.9), 0 0 45px rgba(242, 140, 166, 0.6), 0 0 90px rgba(242, 140, 166, 0.35);
      animation: nucleoPulsoB 2.4s ease-in-out infinite;
    }
    @keyframes nucleoPulsoB {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    .burbuja-texto {
      font-family: 'Poppins', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(245, 230, 234, 0.75);
      font-weight: 400;
      animation: fadeTextoB 3.4s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(242, 140, 166, 0.5);
    }
    @keyframes fadeTextoB {
      0%, 100% { opacity: 0.5; letter-spacing: 7px; }
      50% { opacity: 1; letter-spacing: 9px; }
    }

    /* Info debajo de la burbuja */
    .burbuja-info {
      text-align: center;
      margin-top: 22px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease 0.5s, transform 0.8s ease 0.5s;
    }
    .burbuja-video.revelado .burbuja-info {
      opacity: 1;
      transform: translateY(0);
    }
    .burbuja-info-fecha {
      font-family: 'Poppins', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #f28ca6;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    .burbuja-info-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: #3a2145;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .burbuja-info-desc {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      color: #7a5c8c;
      font-weight: 300;
      line-height: 1.5;
      max-width: 500px;
      margin: 0 auto;
    }
    .burbuja-info-autor {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 50px;
      margin-top: 8px;
    }
    .burbuja-info-autor.gael { color: #4a6a8a; background: rgba(74, 106, 138, 0.1); }
    .burbuja-info-autor.mary { color: #a84a7a; background: rgba(168, 74, 122, 0.1); }

    /* Ripple y explosión */
    .ripple-absorcion {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .ripple-absorcion::before,
    .ripple-absorcion::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 100%;
      height: 100%;
      border-radius: 50% / 45%;
      border: 2px solid rgba(242, 140, 166, 0.9);
      opacity: 0;
    }
    .burbuja-video.absorbiendo .ripple-absorcion::before { animation: rippleAnima 1.2s ease-out; }
    .burbuja-video.absorbiendo .ripple-absorcion::after { animation: rippleAnima 1.2s ease-out 0.25s; }
    @keyframes rippleAnima {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
    }

    .explosion-canvas { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
    .burbuja-video.revelando .explosion-canvas { opacity: 1; }

    .flash-revelado {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.7), transparent 65%);
      z-index: 7;
      pointer-events: none;
      opacity: 0;
    }
    .burbuja-video.revelando .flash-revelado { animation: flashAnimB 1s ease-out; }
    @keyframes flashAnimB { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

    /* ============================================
       MODAL PANTALLA COMPLETA
       ============================================ */
    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(3, 1, 5, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .video-modal.activo { opacity: 1; pointer-events: auto; }

    .video-modal-inner {
      position: relative;
      width: auto;
      height: auto;
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 120px rgba(242, 140, 166, 0.35);
      transform: scale(0.7) rotateX(15deg);
      opacity: 0;
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-modal.activo .video-modal-inner { transform: scale(1) rotateX(0); opacity: 1; }

    .video-modal-inner video,
    .video-modal-inner img { max-width: 90vw; max-height: 85vh; display: block; object-fit: contain; }

    .video-modal-cerrar {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(242, 140, 166, 0.4);
      background: rgba(10, 5, 10, 0.7);
      backdrop-filter: blur(10px);
      color: #f28ca6;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 5;
    }
    .video-modal-cerrar:hover {
      background: #f28ca6;
      color: #0a050a;
      transform: rotate(90deg) scale(1.05);
      box-shadow: 0 0 30px rgba(242, 140, 166, 0.6);
    }

    /* ============================================
       GALERÍA DE FOTOS (arriba)
       ============================================ */
    .galeria {
      max-width: 1200px;
      margin: 0 auto 60px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .galeria-item {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(242, 140, 166, 0.15);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      margin: 0;
    }
    .galeria-item:hover { transform: translateY(-6px); box-shadow: 0 20px 45px rgba(242, 140, 166, 0.3); }
    .galeria-item img { width: 100%; height: 220px; object-fit: cover; display: block; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .galeria-item:hover img { transform: scale(1.05); }
    .galeria-item figcaption { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 8px; }
    .recuerdo-fecha { font-family: 'Poppins', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; color: #f28ca6; text-transform: uppercase; margin: 0; }
    .recuerdo-texto { font-family: 'Poppins', sans-serif; font-size: 0.95rem; color: #6b5560; line-height: 1.5; margin: 0; font-weight: 300; }

    /* ============================================
       BOTÓN AGREGAR
       ============================================ */
    .btn-agregar-galeria {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #f28ca6, #d4a373);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 24px rgba(242, 140, 166, 0.4);
    }
    .btn-agregar-galeria:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 34px rgba(242, 140, 166, 0.6); }

    /* ============================================
       FILTROS
       ============================================ */
    .filtros-barra {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-end;
      padding: 22px 26px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(160, 100, 220, 0.12);
      border: 1px solid rgba(242, 140, 166, 0.15);
      margin-bottom: 20px;
    }
    .filtro-grupo { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
    .filtro-busqueda { flex: 2; min-width: 220px; }
    .filtro-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8a7aa8; }
    .filtro-select,
    .filtro-input {
      padding: 10px 14px;
      border: 1.5px solid rgba(180, 130, 240, 0.25);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      color: #3a2145;
      outline: none;
      background: #fff;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .filtro-select:focus,
    .filtro-input:focus { border-color: #a874e8; box-shadow: 0 0 0 3px rgba(168, 116, 232, 0.12); }
    .btn-nuevo-album {
      padding: 10px 22px;
      background: linear-gradient(135deg, #a874e8, #d4a373);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      height: fit-content;
    }
    .btn-nuevo-album:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(168, 116, 232, 0.4); }

    .albums-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; padding: 0 4px; }
    .album-chip {
      padding: 8px 18px;
      background: #fff;
      border: 1.5px solid rgba(180, 130, 240, 0.25);
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      color: #7a5c8c;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .album-chip:hover { border-color: #a874e8; transform: translateY(-2px); }
    .album-chip.activo {
      background: linear-gradient(135deg, #a874e8, #d4a373);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(168, 116, 232, 0.35);
    }

    /* Lightbox */
    .lightbox-galeria {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      opacity: 0;
      animation: fadeInLightbox 0.4s ease forwards;
      cursor: zoom-out;
    }
    @keyframes fadeInLightbox { to { opacity: 1; } }
    .lightbox-contenido { max-width: 95vw; max-height: 90vh; position: relative; display: flex; flex-direction: column; align-items: center; }
    .lightbox-contenido img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
      animation: zoomLightbox 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes zoomLightbox { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .lightbox-caption { margin-top: 20px; color: #fff; font-family: 'Poppins', sans-serif; font-size: 1rem; text-align: center; max-width: 600px; line-height: 1.5; opacity: 0.9; }
    .lightbox-cerrar {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
    }
    .lightbox-cerrar:hover { background: rgba(255, 255, 255, 0.3); transform: rotate(90deg); }

    /* ============================================
       MODAL DE SUBIDA
       ============================================ */
    .subida-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(60, 30, 90, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(14px);
    }
    .subida-modal.activo { opacity: 1; pointer-events: auto; }
    .subida-papel {
      background: #fff;
      border-radius: 24px;
      padding: 40px 35px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.3);
      position: relative;
      transform: scale(0.9);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .subida-modal.activo .subida-papel { transform: scale(1); }
    .subida-cerrar {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(242, 140, 166, 0.15);
      color: #a874e8;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .subida-cerrar:hover { background: #a874e8; color: #fff; }
    .subida-titulo { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #a874e8; margin-bottom: 8px; text-align: center; }

      data-cancion-titulo="Nuestra Canción"

  <script>
    /* ============================================
       RENDERIZADO DE VIDEOS EN BURBUJAS
       ============================================ */
    (function () {
      "use strict";

      const JSONBIN_MASTER_KEY = "$2a$10$o5/KkktxRiEfoxN33ZQQieN0iUvv/pkvIG8riNohEo5N4I7NCGU2q";
      const JSONBIN_BIN_ID = "6aa58aecffd5d16053fef5c0";
      const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;

      function crearMiniBurbujas(contenedor) {
        const cantidad = 6;
        for (let i = 0; i < cantidad; i++) {
          const b = document.createElement("div");
          b.className = "mini-b";
          const size = Math.random() * 30 + 10;
          b.style.cssText = `position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(242,140,166,0.15) 40%, transparent 70%);border:1px solid rgba(242,140,166,0.25);box-shadow:inset 0 0 15px rgba(242,140,166,0.3), 0 0 20px rgba(242,140,166,0.15);animation:flotarMini 5s ease-in-out infinite;opacity:0.7;`;
          b.style.width = size + "px";
          b.style.height = size + "px";
          const angulo = (Math.PI * 2 * i) / cantidad + Math.random() * 0.5;
          const radio = 52 + Math.random() * 15;
          b.style.left = (50 + Math.cos(angulo) * radio) + "%";
          b.style.top = (50 + Math.sin(angulo) * (radio * 0.7)) + "%";
          b.style.transform = "translate(-50%, -50%)";
          b.style.animationDelay = (Math.random() * 4) + "s";
          contenedor.appendChild(b);
        }
      }

      function explosion(canvas) {
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        ctx.scale(devicePixelRatio, devicePixelRatio);
        const w = rect.width, h = rect.height;
        const cx = w / 2, cy = h / 2;
        const particles = [];
        const TOTAL = 70;
        for (let i = 0; i < TOTAL; i++) {
          const angle = (Math.PI * 2 * i) / TOTAL + Math.random() * 0.4;
          const speed = Math.random() * 6 + 3;
          particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: Math.random() * 3.5 + 1,
            vida: 1,
            hue: Math.random() < 0.6 ? "242, 140, 166" : "255, 255, 255"
          });
        }
        const start = performance.now();
        const DURACION = 1500;
        function animate(now) {
          const t = (now - start) / DURACION;
          ctx.clearRect(0, 0, w, h);
          if (t >= 1) { canvas.style.opacity = "0"; return; }
          particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.95; p.vy *= 0.95;
            p.vida = 1 - t;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * p.vida, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.hue}, ${p.vida})`;
            ctx.shadowBlur = 18;
            ctx.shadowColor = `rgba(${p.hue}, ${p.vida})`;
            ctx.fill();
          });
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      }

      // ========== MODAL ==========
      const modal = document.getElementById("videoModal");
      const modalInner = document.getElementById("videoModalInner");
      const modalCerrar = document.getElementById("videoModalCerrar");
      let burbujaActiva = null;
      let playerActivo = null;

      function abrirModal(item, burbuja) {
        burbujaActiva = burbuja;
        modalInner.innerHTML = "";

        if (item.tipo === "video") {
          playerActivo = document.createElement("video");
          playerActivo.src = item.url;
          playerActivo.controls = true;
          playerActivo.playsInline = true;
        } else {
          playerActivo = document.createElement("img");
          playerActivo.src = item.url;
          playerActivo.alt = item.titulo;
        }
        modalInner.appendChild(playerActivo);

        modal.classList.add("activo");
        document.body.style.overflow = "hidden";
        setTimeout(() => {
          if (item.tipo === "video" && playerActivo.play) {
            playerActivo.play().catch(() => {});
          }
        }, 500);
      }

      function cerrarModal() {
        if (!modal.classList.contains("activo")) return;
        modal.classList.add("cerrando");
        if (playerActivo && playerActivo.pause) playerActivo.pause();

        if (burbujaActiva) {
          setTimeout(() => {
            burbujaActiva.classList.add("absorbiendo");
            burbujaActiva.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 400);
          setTimeout(() => {
            burbujaActiva.classList.remove("absorbiendo");
          }, 1800);
        }

        setTimeout(() => {
          modal.classList.remove("activo");
          modal.classList.remove("cerrando");
          document.body.style.overflow = "";
          setTimeout(() => {
            modalInner.innerHTML = "";
            playerActivo = null;
          }, 600);
        }, 900);

        burbujaActiva = null;
      }

      modalCerrar.addEventListener("click", cerrarModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) cerrarModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("activo")) cerrarModal();
      });

      // ========== RENDERIZAR BURBUJAS ==========
      async function renderizarBurbujas() {
        const escenario = document.getElementById("burbujasEscenario");
        if (!escenario) return;

        try {
          const res = await fetch(JSONBIN_URL + "/latest", {
            headers: {
              "X-Master-Key": JSONBIN_MASTER_KEY,
              "X-Bin-Meta": "false"
            }
          });
          if (!res.ok) throw new Error("Error cargando");
          const data = await res.json();

          // Obtener recuerdos tipo video
          let videos = (data.recuerdos || []).filter(r => r.tipo === "video");

          // Aplicar filtros
          const filtros = window.__filtrosRecuerdos || {};
          if (filtros.album && filtros.album !== "todos" && filtros.album !== "sin-album") {
            videos = videos.filter(v => v.albumId === filtros.album);
          } else if (filtros.album === "sin-album") {
            videos = videos.filter(v => !v.albumId);
          }
          if (filtros.fecha && filtros.fecha !== "todas") {
            videos = videos.filter(v => {
              const fecha = new Date(v.fecha);
              const key = fecha.getFullYear() + "-" + String(fecha.getMonth() + 1).padStart(2, "0");
              return key === filtros.fecha;
            });
          }
          if (filtros.autor && filtros.autor !== "todos") {
            videos = videos.filter(v => v.autor === filtros.autor);
          }
          if (filtros.busqueda) {
            videos = videos.filter(v =>
              (v.titulo || "").toLowerCase().includes(filtros.busqueda) ||
              (v.descripcion || "").toLowerCase().includes(filtros.busqueda)
            );
          }

          // Ordenar más recientes primero
          videos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

          // Si no hay videos, mostrar mensaje
          if (videos.length === 0) {
            escenario.innerHTML = `
              <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#a08bb8;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;">
                <strong style="display:block;font-family:'Playfair Display',serif;font-style:normal;font-size:1.5rem;color:#a874e8;margin-bottom:10px;">Todavía no hay videos</strong>
                Presioná "🎬 Agregar video" para subir el primero 💜
              </div>
            `;
            return;
          }

          // Renderizar burbujas
          escenario.innerHTML = videos.map((video) => {
            const autorIcono = video.autor === "Mary" ? "✿" : "✎";
            const autorClase = video.autor === "Mary" ? "mary" : "gael";
            const fechaFormateada = new Date(video.fecha).toLocaleDateString("es-ES", {
              day: "numeric",
              month: "long",
              year: "numeric"
            });

            return `
              <div class="burbuja-video" data-video data-id="${video.id}">
                <div class="mini-burbujas"></div>
                <div class="burbuja-inner">
                  <video preload="metadata" playsinline muted>
                    <source src="${video.url}" type="video/mp4">
                  </video>
                  <div class="burbuja-portada">
                    <div class="burbuja-contenido">
                      <div class="burbuja-simbolo">
                        <div class="anillo-b"></div>
                        <div class="anillo-b"></div>
                        <div class="anillo-b"></div>
                        <div class="nucleo-b"></div>
                      </div>
                      <div class="burbuja-texto">Toca para revelar</div>
                    </div>
                  </div>
                </div>
                <div class="ripple-absorcion"></div>
                <canvas class="explosion-canvas"></canvas>
                <div class="flash-revelado"></div>

                <div class="burbuja-info">
                  <span class="burbuja-info-fecha">${fechaFormateada}</span>
                  <h3 class="burbuja-info-titulo">${video.titulo}</h3>
                  ${video.descripcion ? `<p class="burbuja-info-desc">${video.descripcion}</p>` : ""}
                  <span class="burbuja-info-autor ${autorClase}">${autorIcono} ${video.autor}</span>
                </div>
              </div>
            `;
          }).join("");

          // Conectar eventos a las burbujas
          const burbujas = escenario.querySelectorAll("[data-video]");
          burbujas.forEach(burbuja => {
            const miniCont = burbuja.querySelector(".mini-burbujas");
            if (miniCont) crearMiniBurbujas(miniCont);

            const video = burbuja.querySelector("video");
            const explosionCanvas = burbuja.querySelector(".explosion-canvas");
            const id = burbuja.dataset.id;
            const item = videos.find(v => v.id === id);

            if (!video || !item) return;

            video.removeAttribute("controls");
            video.controls = false;
            video.pause();

            burbuja.addEventListener("click", () => {
              if (burbuja.classList.contains("revelando") || burbuja.classList.contains("revelado")) {
                abrirModal(item, burbuja);
                return;
              }

              burbuja.classList.add("revelando");
              if (explosionCanvas) explosion(explosionCanvas);

              video.muted = true;
              video.play().catch(() => {});

              setTimeout(() => {
                burbuja.classList.remove("revelando");
                burbuja.classList.add("revelado");
                video.pause();
                video.currentTime = 0;
                video.muted = false;

                abrirModal(item, burbuja);
              }, 900);
            });
          });

          // Reveal al scroll
          const io = new IntersectionObserver((entries) => {
            entries.forEach(e => {
              if (e.isIntersecting) e.target.classList.add("visible");
            });
          }, { threshold: 0.15 });

          burbujas.forEach(b => io.observe(b));

        } catch (err) {
          console.error("Error renderizando burbujas:", err);
          escenario.innerHTML = `<p style="text-align:center;color:#d96666;">Error cargando videos. Recargá la página.</p>`;
        }
      }

      // Exponer globalmente para recargar cuando cambien filtros
      window.renderizarBurbujasVideos = renderizarBurbujas;

      // Detectar cambios de filtros desde galeria-usuario.js
      window.addEventListener("filtrosCambiados", () => {
        renderizarBurbujas();
      });

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => renderizarBurbujas(), 1500);
      });

    })();
  </script>

  <script>
    /* ============================================
