<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Recuerdos 💜</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#e9d5ff" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>" />

  <script>
    (function() {
      const ok = localStorage.getItem("auth_novia_ok");
      const t = parseInt(localStorage.getItem("auth_novia_time") || "0", 10);
      const valido = ok === "true" && (Date.now() - t) < 60 * 60 * 1000;
      if (!valido) location.replace("../login.html");
    })();
  </script>

  <style>
    /* ============================================
       RECUERDOS — EXPERIENCIA PREMIUM
       ============================================ */

    html, body.recuerdos-page { margin: 0; padding: 0; min-height: 100vh; }

    body.recuerdos-page {
      background: #faf3ff;
      color: #3a2145;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Evitar scroll cuando el modal está abierto */
    body.modal-abierto {
      overflow: hidden !important;
      height: 100vh;
      height: 100dvh;
    }

    .aurora-canvas {
      position: fixed; inset: 0; z-index: -3; pointer-events: none;
    }
    .particulas-canvas {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
    }

    body.recuerdos-page::after {
      content: "";
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 8% 22%, rgba(201, 156, 240, 0.35) 1px, transparent 1.5px),
        radial-gradient(circle at 78% 18%, rgba(240, 170, 200, 0.4) 1px, transparent 1.5px),
        radial-gradient(circle at 44% 76%, rgba(201, 156, 240, 0.3) 1px, transparent 1.5px),
        radial-gradient(circle at 92% 60%, rgba(240, 170, 200, 0.35) 1px, transparent 1.5px);
      z-index: -1;
      pointer-events: none;
      animation: titilarEstrellas 6s ease-in-out infinite alternate;
    }
    @keyframes titilarEstrellas {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    body.recuerdos-page .nav-back {
      position: sticky; top: 0;
      padding: 16px 30px;
      background: rgba(255, 250, 255, 0.65);
      border-bottom: 1px solid rgba(180, 130, 240, 0.12);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      z-index: 100;
    }
    body.recuerdos-page .nav-back a {
      color: #6a4780;
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.3s ease;
      text-decoration: none;
    }
    body.recuerdos-page .nav-back a:hover { color: #a874e8; }

    /* ============================================
       HERO
       ============================================ */
    .recuerdos-hero {
      max-width: 960px;
      margin: 0 auto;
      padding: 90px 24px 30px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .recuerdos-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #a874e8;
      font-weight: 600;
      margin-bottom: 26px;
      opacity: 0;
      animation: fadeInRecuerdos 1.2s ease 0.2s forwards;
    }
    .recuerdos-hero-badge::before,
    .recuerdos-hero-badge::after {
      content: "";
      width: 32px;
      height: 1px;
      background: linear-gradient(to right, transparent, #c99cf0, transparent);
    }
    .recuerdos-hero h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2rem, 5.5vw, 3.6rem);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #3a2145;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeInRecuerdos 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }
    .recuerdos-hero h1 em {
      color: #a874e8;
      font-style: italic;
      text-shadow: 0 0 40px rgba(201, 156, 240, 0.5);
      position: relative;
      display: inline-block;
    }
    .recuerdos-hero h1 em::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -8px;
      height: 1px;
      background: linear-gradient(to right, transparent, #c99cf0, transparent);
      animation: lineaHero 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both;
      transform-origin: center;
    }
    @keyframes lineaHero {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }
    .recuerdos-hero p {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      font-style: italic;
      font-weight: 300;
      color: #7a5c8c;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeInRecuerdos 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
    }
    @keyframes fadeInRecuerdos {
      from { opacity: 0; transform: translateY(20px); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* ============================================
       CONTROLES PREMIUM
       ============================================ */
    .recuerdos-controles {
      max-width: 1000px;
      margin: 50px auto 0;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      animation: fadeInRecuerdos 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
    }

    .recuerdos-contador {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 22px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(180, 130, 240, 0.22);
      border-radius: 50px;
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      box-shadow: 0 8px 24px rgba(160, 100, 220, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6a4780;
      font-weight: 600;
      white-space: nowrap;
    }
    .recuerdos-contador-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-style: italic;
      color: #a874e8;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 500;
    }

    .recuerdos-buscador-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 320px;
    }
    #buscadorRecuerdos {
      width: 100%;
      min-height: 48px;
      padding: 12px 20px 12px 46px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(180, 130, 240, 0.22);
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.88rem;
      color: #4a2a5a;
      outline: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      box-shadow: 0 8px 24px rgba(160, 100, 220, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }
    #buscadorRecuerdos::placeholder {
      color: #a08bb8;
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
    }
    #buscadorRecuerdos:focus {
      border-color: rgba(180, 130, 240, 0.55);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 32px rgba(160, 100, 220, 0.22), inset 0 1px 0 rgba(255, 255, 255, 1), 0 0 0 4px rgba(201, 156, 240, 0.15);
    }
    .recuerdos-buscador-wrap::before {
      content: "";
      position: absolute;
      left: 18px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      border: 1.5px solid #c99cf0;
      border-radius: 50%;
      pointer-events: none;
    }
    .recuerdos-buscador-wrap::after {
      content: "";
      position: absolute;
      left: 30px; top: 60%;
      width: 8px; height: 1.5px;
      background: #c99cf0;
      transform: rotate(45deg);
      transform-origin: left;
      pointer-events: none;
      border-radius: 2px;
    }

    .btn-nuevo-recuerdo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 26px;
      background: linear-gradient(135deg, #a874e8 0%, #f28ca6 100%);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 28px rgba(160, 100, 220, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .btn-nuevo-recuerdo::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.4) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.8s ease;
    }
    .btn-nuevo-recuerdo:hover::before { transform: translateX(100%); }
    .btn-nuevo-recuerdo:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 16px 38px rgba(160, 100, 220, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .btn-nuevo-recuerdo::after {
      content: "✨";
      margin-left: 4px;
    }

    /* ============================================
       GRID DE RECUERDOS
       ============================================ */
    .recuerdos-grid {
      max-width: 1320px;
      margin: 30px auto 0;
      padding: 10px 24px 120px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      position: relative;
      z-index: 2;
    }

    .recuerdo-card {
      position: relative;
      padding: 0;
      border-radius: 4px 24px 4px 24px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.98) 0%, rgba(252, 244, 255, 0.95) 55%, rgba(255, 248, 252, 0.98) 100%);
      border: 1px solid rgba(200, 160, 240, 0.3);
      box-shadow: 0 14px 38px rgba(160, 100, 220, 0.12), 0 4px 12px rgba(200, 160, 240, 0.1), inset 0 1px 0 rgba(255, 255, 255, 1);
      cursor: pointer;
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s ease, border-color 0.3s ease;
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      overflow: hidden;
      isolation: isolate;
      will-change: transform;
    }
    .recuerdo-card::before {
      content: "";
      position: absolute;
      top: -30%; left: -20%;
      width: 120%; height: 120%;
      background: radial-gradient(ellipse at 30% 20%, rgba(220, 180, 255, 0.45) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
      transition: opacity 0.6s ease, transform 0.8s ease;
    }
    .recuerdo-card::after {
      content: "";
      position: absolute;
      top: 14px; right: 14px;
      width: 22px; height: 22px;
      border-top: 1px solid rgba(201, 156, 240, 0.5);
      border-right: 1px solid rgba(201, 156, 240, 0.5);
      border-radius: 0 8px 0 0;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }
    .recuerdo-card.visible { opacity: 1; transform: translateY(0) scale(1); }
    .recuerdo-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(201, 156, 240, 0.65);
      box-shadow: 0 24px 60px rgba(160, 100, 220, 0.25), 0 8px 24px rgba(200, 160, 240, 0.2), inset 0 1px 0 rgba(255, 255, 255, 1);
    }
    .recuerdo-card:hover::before { opacity: 1; transform: scale(1.15); }
    .recuerdo-card:hover::after {
      top: 10px; right: 10px;
      width: 30px; height: 30px;
      border-color: rgba(201, 156, 240, 1);
      border-radius: 0 12px 0 0;
    }

    .recuerdo-media {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      border-radius: 4px 24px 0 0;
      background: #f0e8f8;
      position: relative;
      z-index: 1;
    }

    .recuerdo-info {
      padding: 18px 22px 22px;
      position: relative;
      z-index: 2;
    }

    .recuerdo-fecha {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #a874e8;
      font-weight: 600;
      margin-bottom: 10px;
      opacity: 0.85;
    }
    .recuerdo-titulo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      color: #4a2a5a;
      margin: 0 0 6px;
      letter-spacing: 0.003em;
    }
    .recuerdo-desc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      font-style: italic;
      color: #8a7aa8;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(201, 156, 240, 0.4);
      line-height: 1.5;
    }

    .recuerdo-delete {
      position: absolute;
      top: 14px;
      right: 42px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(217, 102, 102, 0.15);
      color: #d96666;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
      z-index: 5;
    }
    .recuerdo-card:hover .recuerdo-delete { opacity: 1; }
    .recuerdo-delete:hover { background: #d96666; color: #fff; transform: scale(1.15); }

    .recuerdos-vacio {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 30px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: #a08bb8;
      line-height: 1.6;
    }
    .recuerdos-vacio::before {
      content: "❦";
      display: block;
      font-size: 2.4rem;
      color: #c99cf0;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    /* ============================================
       MODAL DE RECUERDO (VISOR CENTRADO Y FIJO)
       ============================================ */
    .recuerdo-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 9999;
      background: rgba(20, 10, 35, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      touch-action: none;
      overscroll-behavior: none;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .recuerdo-modal.activo {
      opacity: 1;
      pointer-events: auto;
    }

    .recuerdo-modal-contenido {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .recuerdo-modal-media {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      pointer-events: auto;
      margin: auto;
    }

    .recuerdo-modal-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px 24px calc(30px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(10, 5, 20, 0.95) 0%, rgba(10, 5, 20, 0.7) 60%, transparent 100%);
      text-align: center;
      pointer-events: none;
      z-index: 3;
      transition: opacity 0.3s ease;
    }
    .recuerdo-modal-titulo {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: #fff;
      margin: 0 0 6px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }
    .recuerdo-modal-desc {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      margin: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    .recuerdo-modal-fecha {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(201, 156, 240, 0.9);
      margin-bottom: 8px;
      display: block;
    }

    .recuerdo-modal-cerrar {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: 16px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      -webkit-tap-highlight-color: transparent;
    }
    .recuerdo-modal-cerrar:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.3);
    }

    .recuerdo-modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .recuerdo-modal-nav:active {
      transform: translateY(-50%) scale(0.92);
      background: rgba(255, 255, 255, 0.3);
    }
    .recuerdo-modal-nav.prev { left: 12px; }
    .recuerdo-modal-nav.next { right: 12px; }
    .recuerdo-modal-nav:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    /* Ocultar info al tocar la imagen (para verla completa) */
    .recuerdo-modal.ocultar-info .recuerdo-modal-info {
      opacity: 0;
    }

    /* ============================================
       MODAL NUEVO RECUERDO
       ============================================ */
    .nuevo-modal {
      position: fixed; inset: 0;
      z-index: 9999;
      background: rgba(60, 30, 90, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow-y: auto;
    }
    .nuevo-modal.activo { opacity: 1; pointer-events: auto; }

    .nuevo-marco {
      position: relative;
      max-width: 560px;
      width: 100%;
      padding: 4px;
      background: linear-gradient(135deg, rgba(201, 156, 240, 0.9), rgba(240, 200, 230, 0.7), rgba(201, 156, 240, 0.9));
      border-radius: 40px;
      transform: scale(0.85);
      opacity: 0;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
      box-shadow: 0 40px 120px rgba(120, 60, 180, 0.4);
      margin: auto;
    }
    .nuevo-modal.activo .nuevo-marco { transform: scale(1); opacity: 1; }

    .nuevo-inner {
      padding: 45px 40px 40px;
      background: linear-gradient(150deg, rgba(255, 253, 255, 1), rgba(252, 244, 255, 0.98), rgba(255, 248, 252, 1));
      border-radius: 36px;
      position: relative;
    }
    .nuevo-inner h2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.7rem;
      color: #3a2145;
      text-align: center;
      margin-bottom: 28px;
    }
    .nuevo-campo { margin-bottom: 18px; }
    .nuevo-label {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8a7aa8;
      margin-bottom: 8px;
    }
    .nuevo-input,
    .nuevo-textarea {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid rgba(180, 130, 240, 0.3);
      border-radius: 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: #3a2145;
      outline: none;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.85);
      box-sizing: border-box;

  <script>
    /* ============================================
       RECUERDOS — Sistema completo
       ============================================ */
    (function () {
      "use strict";

      const JSONBIN_MASTER_KEY = "$2a$10$o5/KkktxRiEfoxN33ZQQieN0iUvv/pkvIG8riNohEo5N4I7NCGU2q";
      const JSONBIN_BIN_ID = "6aa58aecffd5d16053fef5c0";
      const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;

      let recuerdos = [];
      let filtroTexto = "";
      let recuerdoActualIndex = -1;
      let recuerdosFiltrados = [];

      // ========== CARGAR RECUERDOS ==========
      async function cargarRecuerdos() {
        try {
          const res = await fetch(JSONBIN_URL + "/latest", {
            headers: { "X-Master-Key": JSONBIN_MASTER_KEY, "X-Bin-Meta": "false" }
          });
          if (res.ok) {
            const data = await res.json();
            recuerdos = data.recuerdos || [];
          }
        } catch (err) {
          console.warn("No se pudieron cargar los recuerdos:", err);
          recuerdos = [];
        }
        recuerdos.sort((a, b) => new Date(b.fecha || 0) - new Date(a.fecha || 0));
      }

      // ========== GUARDAR RECUERDO ==========
      async function guardarRecuerdoEnBin(recuerdo) {
        const res = await fetch(JSONBIN_URL + "/latest", {
          headers: { "X-Master-Key": JSONBIN_MASTER_KEY, "X-Bin-Meta": "false" }
        });
        if (!res.ok) throw new Error("Error leyendo JSONBin");
        const data = await res.json();
        const nuevoContenido = {
          entradas: data.entradas || [],
          suscripciones: data.suscripciones || [],
          recuerdos: data.recuerdos || [],
          razones: data.razones || [],
          albums: data.albums || []
        };
        nuevoContenido.recuerdos.unshift(recuerdo);
        const putRes = await fetch(JSONBIN_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_MASTER_KEY },
          body: JSON.stringify(nuevoContenido)
        });
        if (!putRes.ok) throw new Error("Error guardando en JSONBin");
        return true;
      }

      // ========== ELIMINAR RECUERDO ==========
      async function eliminarRecuerdoEnBin(recuerdoId) {
        const res = await fetch(JSONBIN_URL + "/latest", {
          headers: { "X-Master-Key": JSONBIN_MASTER_KEY, "X-Bin-Meta": "false" }
        });
        if (!res.ok) throw new Error("Error leyendo JSONBin");
        const data = await res.json();
        const nuevoContenido = {
          entradas: data.entradas || [],
          suscripciones: data.suscripciones || [],
          recuerdos: (data.recuerdos || []).filter(r => r.id !== recuerdoId),
          razones: data.razones || [],
          albums: data.albums || []
        };
        const putRes = await fetch(JSONBIN_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_MASTER_KEY },
          body: JSON.stringify(nuevoContenido)
        });
        if (!putRes.ok) throw new Error("Error guardando en JSONBin");
        return true;
      }

      // ============================================
      // AURORAS DE FONDO
      // ============================================
      (function auroraFondo() {
        const canvas = document.getElementById("auroraCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let w, h;
        function resize() {
          w = canvas.width = window.innerWidth * devicePixelRatio;
          h = canvas.height = window.innerHeight * devicePixelRatio;
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
        }
        resize();
        window.addEventListener("resize", resize);

        const blobs = [
          { x: 0.2, y: 0.3, r: 0.55, color: [233, 213, 255], speed: 0.00010, fase: 0 },
          { x: 0.8, y: 0.7, r: 0.5, color: [255, 214, 232], speed: 0.00013, fase: Math.PI },
          { x: 0.5, y: 0.5, r: 0.45, color: [240, 220, 255], speed: 0.00008, fase: Math.PI * 1.4 },
          { x: 0.15, y: 0.8, r: 0.4, color: [255, 235, 245], speed: 0.00011, fase: Math.PI * 0.6 }
        ];
        const start = performance.now();
        function render(now) {
          const t = now - start;
          ctx.clearRect(0, 0, w, h);
          blobs.forEach(b => {
            const cx = (b.x + Math.sin(t * b.speed + b.fase) * 0.12) * w;
            const cy = (b.y + Math.cos(t * b.speed * 1.3 + b.fase) * 0.12) * h;
            const r = b.r * Math.min(w, h);
            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            gradient.addColorStop(0, `rgba(${b.color[0]}, ${b.color[1]}, ${b.color[2]}, 0.55)`);
            gradient.addColorStop(0.5, `rgba(${b.color[0]}, ${b.color[1]}, ${b.color[2]}, 0.2)`);
            gradient.addColorStop(1, `rgba(${b.color[0]}, ${b.color[1]}, ${b.color[2]}, 0)`);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
          });
          requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
      })();

      // ============================================
      // PARTÍCULAS DE POLVO
      // ============================================
      (function polvoDorado() {
        const canvas = document.getElementById("particulasCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let w, h;
        function resize() {
          w = canvas.width = window.innerWidth * devicePixelRatio;
          h = canvas.height = window.innerHeight * devicePixelRatio;
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
        }
        resize();
        window.addEventListener("resize", resize);
        const N = Math.min(70, Math.floor(window.innerWidth / 22));
        const parts = [];
        for (let i = 0; i < N; i++) {
          parts.push({
            x: Math.random() * w, y: Math.random() * h,
            r: (Math.random() * 1.5 + 0.4) * devicePixelRatio,
            vx: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
            vy: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
            a: Math.random() * 0.5 + 0.2, fase: Math.random() * Math.PI * 2,
            tipo: Math.random() < 0.6 ? "lav" : "dor"
          });
        }
        let mouseX = -9999, mouseY = -9999;
        window.addEventListener("mousemove", (e) => {
          mouseX = e.clientX * devicePixelRatio;
          mouseY = e.clientY * devicePixelRatio;
        });
        function render() {
          ctx.clearRect(0, 0, w, h);
          parts.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.fase += 0.01;
            const dx = mouseX - p.x, dy = mouseY - p.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 200 * devicePixelRatio && dist > 1) {
              const fuerza = (200 * devicePixelRatio - dist) / (200 * devicePixelRatio);
              p.x += (dx / dist) * fuerza * 0.4 * devicePixelRatio;
              p.y += (dy / dist) * fuerza * 0.4 * devicePixelRatio;
            }
            if (p.x < -20) p.x = w + 20;
            if (p.x > w + 20) p.x = -20;
            if (p.y < -20) p.y = h + 20;
            if (p.y > h + 20) p.y = -20;
            const alpha = p.a * (0.7 + 0.3 * Math.sin(p.fase));
            const color = p.tipo === "lav" ? `rgba(201, 156, 240, ${alpha})` : `rgba(212, 163, 115, ${alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.shadowBlur = 12 * devicePixelRatio;
            ctx.shadowColor = color;
            ctx.fill();
          });
          requestAnimationFrame(render);
        }
        render();
      })();

      // ============================================
      // RENDERIZAR RECUERDOS
      // ============================================
      const grid = document.getElementById("recuerdosGrid");
      const contadorEl = document.getElementById("contadorRecuerdos");
      const buscador = document.getElementById("buscadorRecuerdos");

      function formatFecha(fechaISO) {
        if (!fechaISO) return "";
        try {
          const d = new Date(fechaISO);
          const opciones = { year: "numeric", month: "long", day: "numeric" };
          return d.toLocaleDateString("es-ES", opciones);
        } catch {
          return "";
        }
      }

      function renderRecuerdos(filtro = "") {
        if (!grid) return;
        const filtroLower = filtro.trim().toLowerCase();
        
        recuerdosFiltrados = filtroLower
          ? recuerdos.filter(r =>
              (r.titulo || "").toLowerCase().includes(filtroLower) ||
              (r.descripcion || "").toLowerCase().includes(filtroLower)
            )
          : recuerdos;

        if (recuerdosFiltrados.length === 0) {
          grid.innerHTML = `<div class="recuerdos-vacio">No encontré ese recuerdo... pero seguro que lo vivimos.</div>`;
          if (contadorEl) contadorEl.textContent = recuerdos.length;
          return;
        }

        grid.innerHTML = recuerdosFiltrados.map((r, i) => `
          <article class="recuerdo-card" data-id="${r.id}" data-index="${i}" style="transition-delay: ${Math.min(i * 40, 600)}ms">
            <button class="recuerdo-delete" onclick="event.stopPropagation(); eliminarRecuerdo('${r.id}')" title="Eliminar">🗑️</button>
            <img class="recuerdo-media" src="${r.archivo}" alt="${r.titulo || 'Recuerdo'}" loading="lazy" />
            <div class="recuerdo-info">
              <span class="recuerdo-fecha">${formatFecha(r.fecha)}</span>
              <h3 class="recuerdo-titulo">${r.titulo || "Sin título"}</h3>
              ${r.descripcion ? `<p class="recuerdo-desc">${r.descripcion}</p>` : ""}
            </div>
          </article>
        `).join("");

        animarContador(recuerdos.length);

        grid.querySelectorAll(".recuerdo-card").forEach(card => {
          card.addEventListener("click", () => {
            const index = parseInt(card.dataset.index, 10);
            abrirRecuerdo(index);
          });
        });

        observarReveals();
      }

      function animarContador(total) {
        if (!contadorEl) return;
        const duracion = 800;
        const inicio = performance.now();
        const desde = parseInt(contadorEl.textContent) || 0;
        function paso(now) {
          const t = Math.min((now - inicio) / duracion, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          contadorEl.textContent = Math.round(desde + (total - desde) * ease);
          if (t < 1) requestAnimationFrame(paso);
        }
        requestAnimationFrame(paso);
      }

      let io = null;
      function observarReveals() {
        if (io) io.disconnect();
        io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add("visible");
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.1 });
        grid.querySelectorAll(".recuerdo-card:not(.visible)").forEach(el => io.observe(el));
      }

      // ========== BUSCADOR ==========
      let debounceTimer;
      if (buscador) {
        buscador.addEventListener("input", (e) => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            filtroTexto = e.target.value;
            renderRecuerdos(filtroTexto);
          }, 120);
        });
      }

      // ============================================
      // MODAL VER RECUERDO
      // ============================================
      const modal = document.getElementById("recuerdoModal");
      const modalCerrar = document.getElementById("recuerdoModalCerrar");
      const modalImagen = document.getElementById("recuerdoModalImagen");
      const modalVideo = document.getElementById("recuerdoModalVideo");
      const modalInfo = document.getElementById("recuerdoModalInfo");
      const modalFecha = document.getElementById("recuerdoModalFecha");
      const modalTitulo = document.getElementById("recuerdoModalTitulo");
      const modalDesc = document.getElementById("recuerdoModalDesc");
      const modalPrev = document.getElementById("recuerdoModalPrev");
      const modalNext = document.getElementById("recuerdoModalNext");

      function esVideo(url) {
        if (!url) return false;
        const videoExts = [".mp4", ".webm", ".ogg", ".mov", ".avi", ".mkv"];
        const urlLower = url.toLowerCase();
        return videoExts.some(ext => urlLower.includes(ext)) || urlLower.includes("video");
      }

      function abrirRecuerdo(index) {
        recuerdoActualIndex = index;
        const recuerdo = recuerdosFiltrados[index];
        if (!recuerdo) return;

        // Bloquear scroll
        document.body.classList.add("modal-abierto");
        window.scrollTo(0, window.scrollY);

        // Resetear
        modalImagen.style.display = "none";
        modalVideo.style.display = "none";
        modalImagen.src = "";
        modalVideo.pause();
        modalVideo.src = "";

        const esVid = esVideo(recuerdo.archivo) || (recuerdo.tipo && recuerdo.tipo.startsWith("video"));

        if (esVid) {
          modalVideo.src = recuerdo.archivo;
          modalVideo.style.display = "block";
        } else {
          modalImagen.src = recuerdo.archivo;
          modalImagen.alt = recuerdo.titulo || "Recuerdo";
          modalImagen.style.display = "block";
        }

        modalFecha.textContent = formatFecha(recuerdo.fecha);
        modalTitulo.textContent = recuerdo.titulo || "Sin título";
        modalDesc.textContent = recuerdo.descripcion || "";
        modalDesc.style.display = recuerdo.descripcion ? "block" : "none";

        modalPrev.disabled = recuerdoActualIndex <= 0;
        modalNext.disabled = recuerdoActualIndex >= recuerdosFiltrados.length - 1;

        modal.classList.remove("ocultar-info");
        modal.classList.add("activo");

        if (window.lanzarConfeti) window.lanzarConfeti(300);
      }

      function cerrarRecuerdo() {
        modal.classList.remove("activo");
        document.body.classList.remove("modal-abierto");
        modalVideo.pause();
        modalVideo.src = "";
        modalImagen.src = "";
        recuerdoActualIndex = -1;
      }

      function navegarRecuerdo(direccion) {
        const nuevoIndex = recuerdoActualIndex + direccion;
        if (nuevoIndex < 0 || nuevoIndex >= recuerdosFiltrados.length) return;
        abrirRecuerdo(nuevoIndex);
      }

      modalCerrar.addEventListener("click", (e) => {
        e.stopPropagation();
        cerrarRecuerdo();
      });

      // Cerrar al tocar el fondo
      modal.addEventListener("click", (e) => {
        if (e.target === modal) cerrarRecuerdo();
      });

      modalPrev.addEventListener("click", (e) => {
        e.stopPropagation();
        navegarRecuerdo(-1);
      });

      modalNext.addEventListener("click", (e) => {
        e.stopPropagation();
        navegarRecuerdo(1);
      });

      // Tocar la imagen para ocultar/mostrar la info
      [modalImagen, modalVideo].forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          modal.classList.toggle("ocultar-info");
        });
      });

      // ========== ELIMINAR RECUERDO ==========
      window.eliminarRecuerdo = async function (recuerdoId) {
        if (!confirm("¿Eliminar este recuerdo? No se puede recuperar 💜")) return;
        try {
          await eliminarRecuerdoEnBin(recuerdoId);
          await cargarRecuerdos();
          renderRecuerdos(filtroTexto);
          if (window.lanzarConfeti) window.lanzarConfeti(600);
        } catch (err) {
          alert("❌ Error: " + err.message);
        }
      };

      // ============================================
      // MODAL NUEVO RECUERDO
      // ============================================
      const nuevoModal = document.getElementById("nuevoModal");
      const btnNuevo = document.getElementById("btnNuevoRecuerdo");
      const nuevoModalCerrar = document.getElementById("nuevoModalCerrar");
      const btnCancelarNuevo = document.getElementById("btnCancelarNuevo");
      const btnGuardarNuevo = document.getElementById("btnGuardarNuevo");
      const nuevoTituloInput = document.getElementById("nuevoTituloInput");
      const nuevoDescInput = document.getElementById("nuevoDescInput");
      const nuevoArchivoInput = document.getElementById("nuevoArchivoInput");
      const nuevoFileBtn = document.getElementById("nuevoFileBtn");
      const nuevoPreviewImg = document.getElementById("nuevoPreviewImg");
      const nuevoPreviewVideo = document.getElementById("nuevoPreviewVideo");

      function abrirNuevoModal() {
        nuevoTituloInput.value = "";
        nuevoDescInput.value = "";
        nuevoArchivoInput.value = "";
        nuevoPreviewImg.classList.remove("visible");
        nuevoPreviewImg.src = "";
        nuevoPreviewVideo.classList.remove("visible");
        nuevoPreviewVideo.src = "";
        nuevoFileBtn.textContent = "📎 Seleccionar archivo";
        nuevoModal.classList.add("activo");
        document.body.classList.add("modal-abierto");
        setTimeout(() => nuevoTituloInput.focus(), 400);
      }

      function cerrarNuevoModal() {
        nuevoModal.classList.remove("activo");
        document.body.classList.remove("modal-abierto");
      }

      if (btnNuevo) btnNuevo.addEventListener("click", abrirNuevoModal);
      if (nuevoModalCerrar) nuevoModalCerrar.addEventListener("click", cerrarNuevoModal);
      if (btnCancelarNuevo) btnCancelarNuevo.addEventListener("click", cerrarNuevoModal);
      nuevoModal.addEventListener("click", (e) => {
        if (e.target === nuevoModal) cerrarNuevoModal();
      });

      if (nuevoArchivoInput) {
        nuevoArchivoInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;

          nuevoFileBtn.textContent = "📎 " + file.name;
          const url = URL.createObjectURL(file);

          if (file.type.startsWith("video/")) {
            nuevoPreviewImg.classList.remove("visible");
            nuevoPreviewImg.style.display = "none";
            nuevoPreviewVideo.src = url;
            nuevoPreviewVideo.classList.add("visible");
            nuevoPreviewVideo.style.display = "block";
          } else {
            nuevoPreviewVideo.classList.remove("visible");
            nuevoPreviewVideo.style.display = "none";
            nuevoPreviewImg.src = url;
            nuevoPreviewImg.classList.add("visible");
            nuevoPreviewImg.style.display = "block";
          }
        });
      }

      if (btnGuardarNuevo) {
        btnGuardarNuevo.addEventListener("click", async () => {
          const titulo = nuevoTituloInput.value.trim();
          const descripcion = nuevoDescInput.value.trim();
          const archivo = nuevoArchivoInput.files[0];

          if (!titulo) { alert("Poné un título 💜"); return; }
          if (!archivo) { alert("Seleccioná una foto o video 💜"); return; }

          btnGuardarNuevo.disabled = true;
          btnGuardarNuevo.textContent = "Guardando...";

          try {
            const base64 = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(archivo);
            });

            const nuevoRecuerdo = {
              id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
              titulo,
              descripcion,
              archivo: base64,
              tipo: archivo.type,
              fecha: new Date().toISOString()
            };

            await guardarRecuerdoEnBin(nuevoRecuerdo);
            await cargarRecuerdos();
            renderRecuerdos(filtroTexto);
            
            if (window.lanzarConfeti) window.lanzarConfeti(1500);
            cerrarNuevoModal();
          } catch (err) {
            alert("❌ Error: " + err.message);
          } finally {
            btnGuardarNuevo.disabled = false;
            btnGuardarNuevo.textContent = "Guardar";
          }
        });
      }

      // ========== TECLADO ==========
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (modal.classList.contains("activo")) cerrarRecuerdo();
          if (nuevoModal.classList.contains("activo")) cerrarNuevoModal();
        }
        if (modal.classList.contains("activo")) {
          if (e.key === "ArrowLeft") navegarRecuerdo(-1);
          if (e.key === "ArrowRight") navegarRecuerdo(1);
        }
      });

      // Prevenir gestos que muevan el modal
      ["touchmove", "gesturestart", "gesturechange", "gestureend"].forEach(evt => {
        modal.addEventListener(evt, (e) => {
          if (e.target === modal || e.target === modalImagen || e.target === modalVideo) {
            e.preventDefault();
          }
        }, { passive: false });
      });

      // ========== INIT ==========
      document.addEventListener("DOMContentLoaded", async () => {
        await cargarRecuerdos();
        renderRecuerdos();
      });

    })();
  </script>
</body>
</html>
