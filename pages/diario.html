<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestro Diario 📖</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Caveat:wght@400;500;700&family=Kalam:wght@300;400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#f5e8d0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />

  <script>
    (function() {
      const ok = localStorage.getItem("auth_novia_ok");
      const t = parseInt(localStorage.getItem("auth_novia_time") || "0", 10);
      const valido = ok === "true" && (Date.now() - t) < 60 * 60 * 1000;
      if (!valido) location.replace("../login.html");
    })();
  </script>

  <style>
    /* ============================================
       DIARIO — MURAL DE POST-ITS EN HOJA DE CUADERNO
       ============================================ */

    html, body.diario-page {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    body.diario-page {
      background: #f4ecd8;
      color: #3a2c1e;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== HOJA DE CUADERNO (fondo) ===== */
    body.diario-page::before {
      content: "";
      position: fixed;
      inset: 0;
      background-color: #fbf6e9;
      background-image:
        linear-gradient(
          to bottom,
          transparent 0,
          transparent 27px,
          rgba(120, 150, 200, 0.35) 27px,
          rgba(120, 150, 200, 0.35) 28px,
          transparent 28px
        ),
        linear-gradient(
          to right,
          transparent 0,
          transparent 70px,
          rgba(220, 100, 120, 0.45) 70px,
          rgba(220, 100, 120, 0.45) 71px,
          transparent 71px
        ),
        radial-gradient(circle at 20% 30%, rgba(200, 180, 150, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(200, 180, 150, 0.06) 0%, transparent 40%);
      background-size: 100% 28px, 100% 100%, 100% 100%, 100% 100%;
      background-attachment: fixed;
      z-index: -2;
      pointer-events: none;
    }

    body.diario-page::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 60%, rgba(80, 60, 30, 0.12) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ===== NAV ===== */
    body.diario-page .nav-back {
      position: sticky;
      top: 0;
      padding: 16px 30px;
      background: rgba(251, 246, 233, 0.9);
      border-bottom: 1px solid rgba(150, 120, 90, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
    }
    body.diario-page .nav-back a {
      color: #8a6a4a;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      transition: color 0.3s ease;
      text-decoration: none;
    }
    body.diario-page .nav-back a:hover {
      color: #c99c5a;
    }

    /* ============================================
       HEADER
       ============================================ */
    .diario-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .diario-header h1 {
      font-family: 'Caveat', cursive;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1;
      color: #4a3520;
      margin-bottom: 14px;
      transform: rotate(-1.5deg);
      text-shadow:
        1px 1px 0 rgba(255, 255, 255, 0.8),
        2px 3px 6px rgba(120, 90, 60, 0.2);
      animation: fadeInDiario 1.2s ease 0.2s both;
    }
    .diario-header h1 em {
      color: #c99c5a;
      font-style: normal;
    }

    .diario-header p {
      font-family: 'Kalam', cursive;
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      font-weight: 300;
      color: #7a6248;
      line-height: 1.5;
      max-width: 520px;
      margin: 0 auto;
      animation: fadeInDiario 1.4s ease 0.4s both;
    }
    @keyframes fadeInDiario {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================
       BARRA DE ACCIONES
       ============================================ */
    .diario-acciones {
      max-width: 1100px;
      margin: 30px auto 0;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      animation: fadeInDiario 1.4s ease 0.6s both;
    }

    .btn-nueva-entrada {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #f5d76e, #e8b84a);
      color: #4a3520;
      border: none;
      border-radius: 14px;
      font-family: 'Kalam', cursive;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow:
        0 10px 24px rgba(200, 160, 80, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      transform: rotate(-1deg);
      position: relative;
    }
    .btn-nueva-entrada::before {
      content: "✎";
      font-size: 1.1rem;
    }
    .btn-nueva-entrada:hover {
      transform: translateY(-3px) rotate(1deg) scale(1.03);
      box-shadow:
        0 16px 34px rgba(200, 160, 80, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .diario-buscador-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 340px;
    }
    #buscadorDiario {
      width: 100%;
      padding: 12px 20px 12px 42px;
      background: rgba(255, 255, 255, 0.75);
      border: 1.5px solid rgba(150, 120, 90, 0.3);
      border-radius: 14px;
      font-family: 'Kalam', cursive;
      font-size: 1rem;
      color: #4a3520;
      outline: none;
      transition: all 0.3s ease;
    }
    #buscadorDiario::placeholder {
      color: #a89078;
      font-style: italic;
    }
    #buscadorDiario:focus {
      border-color: #c99c5a;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(201, 156, 90, 0.15);
    }
    .diario-buscador-wrap::before {
      content: "🔍";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      pointer-events: none;
      opacity: 0.7;
    }

    /* Indicador de sincronización */
    .diario-sync {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(150, 120, 90, 0.2);
      border-radius: 50px;
      font-family: 'Kalam', cursive;
      font-size: 0.82rem;
      font-weight: 600;
      color: #7a6248;
      transition: all 0.3s ease;
    }
    .diario-sync::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8ac47a;
      box-shadow: 0 0 10px rgba(138, 196, 122, 0.7);
      animation: pulsoSync 2s ease-in-out infinite;
    }
    .diario-sync.sincronizando::before {
      background: #e8b84a;
      box-shadow: 0 0 10px rgba(232, 184, 74, 0.7);
    }
    .diario-sync.error::before {
      background: #d96666;
      box-shadow: 0 0 10px rgba(217, 102, 102, 0.7);
    }
    @keyframes pulsoSync {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    /* ============================================
       MURAL DE POST-ITS
       ============================================ */
    .mural {
      max-width: 1200px;
      margin: 50px auto 100px;
      padding: 20px 24px 80px;
      position: relative;
      z-index: 2;
      min-height: 60vh;
    }

    .mural-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 26px;
      grid-auto-flow: dense;
    }

    /* ============================================
       POST-IT
       ============================================ */
    .post-it {
      position: relative;
      padding: 34px 22px 22px;
      min-height: 240px;
      background: #fff9b0;
      box-shadow:
        0 12px 24px rgba(120, 90, 60, 0.18),
        0 3px 8px rgba(120, 90, 60, 0.12);
      cursor: pointer;
      transition:
        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.4s ease;
      opacity: 0;
      transform: translateY(30px) rotate(var(--rot, 0deg));
      display: flex;
      flex-direction: column;
      border-radius: 2px;
      overflow: visible;
    }
    .post-it.visible {
      opacity: 1;
      transform: translateY(0) rotate(var(--rot, 0deg));
    }

    .post-it::after {
      content: "";
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, transparent 50%, rgba(120, 90, 60, 0.15) 50%);
      pointer-events: none;
    }

    .post-it-chinche {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f88, #c44);
      box-shadow:
        0 4px 8px rgba(120, 40, 40, 0.35),
        inset 0 -3px 5px rgba(0, 0, 0, 0.15),
        inset 0 3px 5px rgba(255, 255, 255, 0.4);
      z-index: 2;
    }
    .post-it-chinche::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* Colores de post-its */
    .post-it.color-amarillo { background: #fff9b0; }
    .post-it.color-rosa     { background: #ffd6e8; }
    .post-it.color-celeste  { background: #d4ecff; }
    .post-it.color-verde    { background: #d4f5d0; }
    .post-it.color-naranja  { background: #ffe0c4; }
    .post-it.color-lila     { background: #e8d5ff; }

    .post-it:hover {
      transform: translateY(-6px) rotate(var(--rot, 0deg)) scale(1.03);
      box-shadow:
        0 20px 40px rgba(120, 90, 60, 0.25),
        0 6px 14px rgba(120, 90, 60, 0.15);
      z-index: 5;
    }

    .post-it-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      font-family: 'Kalam', cursive;
      font-size: 0.72rem;
      font-weight: 700;
      color: #6a5540;
      opacity: 0.85;
    }
    .post-it-autor {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 50px;
    }
    .post-it-autor.gael { color: #4a6a8a; }
    .post-it-autor.mary { color: #a84a7a; }
    .post-it-fecha {
      white-space: nowrap;
      opacity: 0.75;
      font-size: 0.68rem;
    }

    .post-it-titulo {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.1;
      color: #3a2c1e;
      margin-bottom: 12px;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.6);
      word-wrap: break-word;
    }

    .post-it-preview {
      font-family: 'Kalam', cursive;
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.5;
      color: #5a4838;
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      text-overflow: ellipsis;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .post-it-hint {
      margin-top: 14px;
      font-family: 'Kalam', cursive;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #8a6a4a;
      opacity: 0;
      transition: opacity 0.3s ease;
      text-align: right;
    }
    .post-it:hover .post-it-hint {
      opacity: 0.9;
    }

    /* ============================================
       EMPTY STATE
       ============================================ */
    .diario-vacio {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 30px;
      font-family: 'Kalam', cursive;
      font-size: 1.2rem;
      color: #8a6a4a;
      line-height: 1.6;
    }
    .diario-vacio::before {
      content: "📌";
      display: block;
      font-size: 3rem;
      margin-bottom: 16px;
    }
    .diario-vacio strong {
      display: block;
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #4a3520;
      margin-bottom: 10px;
    }

    /* ============================================
       MODAL
       ============================================ */
    .diario-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(60, 40, 20, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .diario-modal.activo {
      opacity: 1;
      pointer-events: auto;
    }

    .diario-papel {
      position: relative;
      max-width: 680px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 50px 50px 45px;
      background: #fbf6e9;
      background-image:
        linear-gradient(
          to bottom,
          transparent 0,
          transparent 27px,
          rgba(120, 150, 200, 0.3) 27px,
          rgba(120, 150, 200, 0.3) 28px,
          transparent 28px
        ),
        linear-gradient(
          to right,
          transparent 0,
          transparent 55px,
          rgba(220, 100, 120, 0.4) 55px,
          rgba(220, 100, 120, 0.4) 56px,
          transparent 56px
        );
      background-size: 100% 28px, 100% 100%;
      border-radius: 4px;
      box-shadow:
        0 40px 100px rgba(60, 40, 20, 0.5),
        0 10px 30px rgba(60, 40, 20, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transform: scale(0.9) rotate(-1deg);
      opacity: 0;
      transition:
        transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.5s ease;
      scrollbar-width: thin;
      scrollbar-color: rgba(150, 120, 90, 0.5) transparent;
      z-index: 2;
    }
    .diario-papel::-webkit-scrollbar { width: 6px; }
    .diario-papel::-webkit-scrollbar-thumb {
      background: rgba(150, 120, 90, 0.4);
      border-radius: 50px;
    }
    .diario-modal.activo .diario-papel {
      transform: scale(1) rotate(0);
      opacity: 1;
    }

    .diario-cerrar {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(150, 120, 90, 0.4);
      background: rgba(255, 255, 255, 0.9);
      color: #8a6a4a;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 5;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 12px rgba(120, 90, 60, 0.2);
    }
    .diario-cerrar:hover {
      background: #8a6a4a;
      color: #fff;
      transform: rotate(90deg) scale(1.05);
    }

    .diario-modal-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      font-family: 'Kalam', cursive;
      font-size: 0.82rem;
      font-weight: 700;
      color: #7a6248;
    }
    .diario-modal-autor {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50px;
      border: 1px solid rgba(150, 120, 90, 0.2);
    }
    .diario-modal-autor.gael { color: #4a6a8a; }
    .diario-modal-autor.mary { color: #a84a7a; }
    .diario-modal-fecha {
      opacity: 0.75;
    }

    .diario-modal-titulo {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      line-height: 1.1;
      color: #3a2c1e;
      margin-bottom: 24px;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.6);
      word-wrap: break-word;
    }

    .diario-modal-cuerpo {
      font-family: 'Kalam', cursive;
      font-size: 1.08rem;
      font-weight: 400;
      line-height: 1.9;
      color: #3a2c1e;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .diario-modal-acciones {
      display: flex;
      gap: 12px;
      margin-top: 34px;
      padding-top: 24px;
      border-top: 1.5px dashed rgba(150, 120, 90, 0.3);
      flex-wrap: wrap;
    }

    .btn-diario {
      padding: 11px 22px;
      border-radius: 12px;
      border: none;
      font-family: 'Kalam', cursive;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-diario.primario {
      background: linear-gradient(135deg, #f5d76e, #e8b84a);
      color: #4a3520;
      box-shadow: 0 6px 16px rgba(200, 160, 80, 0.3);
    }
    .btn-diario.primario:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(200, 160, 80, 0.45);
    }
    .btn-diario.peligro {
      background: rgba(217, 102, 102, 0.15);
      color: #b04a4a;
      border: 1.5px solid rgba(217, 102, 102, 0.4);
    }
    .btn-diario.peligro:hover {
      background: rgba(217, 102, 102, 0.25);
      border-color: rgba(217, 102, 102, 0.7);
    }
    .btn-diario.neutro {
      background: rgba(255, 255, 255, 0.85);
      color: #7a6248;
      border: 1.5px solid rgba(150, 120, 90, 0.3);
    }
    .btn-diario.neutro:hover {
      background: #fff;
      border-color: rgba(150, 120, 90, 0.6);
    }

    /* ============================================
       FORMULARIO
       ============================================ */
    .diario-form {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .diario-campo {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .diario-label {
      font-family: 'Kalam', cursive;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8a6a4a;
    }

    .diario-input,
    .diario-textarea {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.75);
      border: 1.5px solid rgba(150, 120, 90, 0.3);
      border-radius: 12px;
      font-family: 'Kalam', cursive;
      font-size: 1rem;
      color: #3a2c1e;
      outline: none;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    .diario-input::placeholder,
    .diario-textarea::placeholder {
      color: #a89078;
      font-style: italic;
    }
    .diario-input:focus,
    .diario-textarea:focus {
      border-color: #c99c5a;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(201, 156, 90, 0.15);
    }
    .diario-textarea {
      min-height: 200px;
      resize: vertical;
      line-height: 1.8;
    }

    .diario-autores {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .diario-autor-btn {
      flex: 1;
      min-width: 120px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid rgba(150, 120, 90, 0.3);
      border-radius: 12px;
      font-family: 'Kalam', cursive;
      font-size: 0.95rem;
      font-weight: 700;
      color: #7a6248;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .diario-autor-btn:hover {
      border-color: rgba(150, 120, 90, 0.6);
      transform: translateY(-2px);
    }
    .diario-autor-btn.activo {
      background: linear-gradient(135deg, #fff9b0, #ffe8a0);
      border-color: #c99c5a;
      color: #4a3520;
      box-shadow: 0 6px 16px rgba(200, 160, 80, 0.3);
    }

    .diario-form-acciones {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
